name: Apply n8n Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Type apply to create or update n8n infrastructure.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: n8n-infra-apply
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: ${{ vars.N8N_ENABLE_CLOUDFLARE_EDGE || 'false' }}
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  apply:
    if: inputs.confirm_apply == 'apply'
    name: Apply n8n infrastructure
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID_ALLANBPEDINIV: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
          CLOUDFLARE_ZONE_ID_LOBST3RS: ${{ vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
          N8N_ENABLE_CLOUDFLARE_EDGE: ${{ vars.N8N_ENABLE_CLOUDFLARE_EDGE || 'false' }}
          N8N_EDITOR_ACCESS_ALLOWED_EMAILS: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
          N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
          N8N_EDITOR_HOSTNAME: ${{ vars.N8N_EDITOR_HOSTNAME }}
          N8N_EDITOR_ZONE_ID: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
          N8N_EDITOR_ZONE_NAME: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
          N8N_GCP_PROJECT_ID: ${{ vars.N8N_GCP_PROJECT_ID }}
          N8N_GCP_REGION: ${{ vars.N8N_GCP_REGION }}
          N8N_GCP_SERVICE_ACCOUNT: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
          N8N_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0

          for name in \
            N8N_GCP_PROJECT_ID \
            N8N_GCP_REGION \
            N8N_GCP_SERVICE_ACCOUNT \
            N8N_GCP_WORKLOAD_IDENTITY_PROVIDER
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing required configuration::$name is not configured"
              missing=1
            fi
          done

          if [ "$N8N_ENABLE_CLOUDFLARE_EDGE" = "true" ]; then
            for name in \
              CLOUDFLARE_ACCOUNT_ID \
              CLOUDFLARE_ZONE_ID_ALLANBPEDINIV \
              CLOUDFLARE_ZONE_ID_LOBST3RS \
              CLOUDFLARE_API_TOKEN
            do
              if [ -z "${!name}" ]; then
                echo "::error title=Missing required Cloudflare configuration::$name is required when N8N_ENABLE_CLOUDFLARE_EDGE is true"
                missing=1
              fi
            done
          fi

          if [ -n "$N8N_EDITOR_HOSTNAME" ]; then
            if [ -z "$N8N_EDITOR_ZONE_ID" ] && [ -z "$N8N_EDITOR_ZONE_NAME" ]; then
              echo "::error title=Missing required editor Cloudflare configuration::Set N8N_EDITOR_ZONE_ID or N8N_EDITOR_ZONE_NAME when N8N_EDITOR_HOSTNAME is configured"
              missing=1
            fi

            if [ "$N8N_EDITOR_ACCESS_ALLOWED_EMAILS" = "[]" ] && [ "$N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS" = "[]" ]; then
              echo "::error title=Missing required editor Access configuration::Set N8N_EDITOR_ACCESS_ALLOWED_EMAILS or N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS when N8N_EDITOR_HOSTNAME is configured"
              missing=1
            fi
          fi

          exit "$missing"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Initialize OpenTofu
        run: tofu -chdir=${{ env.TOFU_DIR }} init -input=false

      - name: Plan n8n infrastructure
        run: tofu -chdir=${{ env.TOFU_DIR }} plan -input=false -out=tfplan

      - name: Apply n8n infrastructure
        run: tofu -chdir=${{ env.TOFU_DIR }} apply -input=false -auto-approve tfplan

      - name: Store n8n MCP Cloudflare Access credentials
        run: |
          set -euo pipefail

          secret_name="abpiv-n8n-mcp-cloudflare-access"
          tmp_file="$(mktemp)"
          trap 'rm -f "$tmp_file"' EXIT
          chmod 600 "$tmp_file"

          client_id="$(tofu -chdir="${TOFU_DIR}" output -raw n8n_mcp_cf_access_client_id)"
          client_secret="$(tofu -chdir="${TOFU_DIR}" output -raw n8n_mcp_cf_access_client_secret)"

          jq -n \
            --arg client_id "$client_id" \
            --arg client_secret "$client_secret" \
            --arg user_agent "Codex-n8n-MCP/1.0" \
            '{
              "CF-Access-Client-Id": $client_id,
              "CF-Access-Client-Secret": $client_secret,
              "User-Agent": $user_agent
            }' > "$tmp_file"

          if ! gcloud secrets describe "$secret_name" --project="${TF_VAR_gcp_project_id}" >/dev/null 2>&1; then
            gcloud secrets create "$secret_name" \
              --project="${TF_VAR_gcp_project_id}" \
              --replication-policy=automatic \
              --labels=app=n8n,component=automation,environment=production,managed_by=github-actions
          fi

          gcloud secrets versions add "$secret_name" \
            --project="${TF_VAR_gcp_project_id}" \
            --data-file="$tmp_file"

      - name: Show n8n outputs
        run: tofu -chdir=${{ env.TOFU_DIR }} output
