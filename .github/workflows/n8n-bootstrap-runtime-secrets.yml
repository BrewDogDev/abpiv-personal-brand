name: Bootstrap n8n Runtime Secrets

on:
  workflow_dispatch:
    inputs:
      confirm_bootstrap:
        description: Type bootstrap to create/rotate the n8n DB password and encryption key.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: n8n-runtime-secret-bootstrap
  cancel-in-progress: false

env:
  N8N_GCP_PROJECT_ID: ${{ vars.N8N_GCP_PROJECT_ID }}
  N8N_GCP_REGION: ${{ vars.N8N_GCP_REGION }}
  N8N_GCP_SERVICE_ACCOUNT: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
  N8N_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
  N8N_SQL_INSTANCE: ${{ vars.N8N_SQL_INSTANCE || 'abpiv-n8n-postgres' }}
  N8N_SQL_USER: ${{ vars.N8N_SQL_USER || 'n8n' }}
  N8N_POSTGRES_PASSWORD_SECRET: ${{ vars.N8N_POSTGRES_PASSWORD_SECRET || 'abpiv-n8n-postgres-password' }}
  N8N_ENCRYPTION_KEY_SECRET: ${{ vars.N8N_ENCRYPTION_KEY_SECRET || 'abpiv-n8n-encryption-key' }}

jobs:
  bootstrap:
    if: inputs.confirm_bootstrap == 'bootstrap'
    name: Bootstrap n8n runtime secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check bootstrap configuration
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error title=Run from main::Runtime secret bootstrap must run from main."
            exit 1
          fi

          missing=0

          for name in \
            N8N_GCP_PROJECT_ID \
            N8N_GCP_REGION \
            N8N_GCP_SERVICE_ACCOUNT \
            N8N_GCP_WORKLOAD_IDENTITY_PROVIDER \
            N8N_SQL_INSTANCE \
            N8N_SQL_USER \
            N8N_POSTGRES_PASSWORD_SECRET \
            N8N_ENCRYPTION_KEY_SECRET
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing bootstrap configuration::$name is not configured"
              missing=1
            fi
          done

          exit "$missing"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.N8N_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Check n8n infrastructure targets
        run: |
          set -euo pipefail

          if ! gcloud sql instances describe "${N8N_SQL_INSTANCE}" \
            --project="${N8N_GCP_PROJECT_ID}" \
            --format="value(name)" >/dev/null; then
            echo "::error title=Cloud SQL instance missing::Run Apply n8n Infrastructure first so OpenTofu creates ${N8N_SQL_INSTANCE}."
            exit 1
          fi

          for secret_name in "${N8N_POSTGRES_PASSWORD_SECRET}" "${N8N_ENCRYPTION_KEY_SECRET}"; do
            if ! gcloud secrets describe "${secret_name}" \
              --project="${N8N_GCP_PROJECT_ID}" \
              --format="value(name)" >/dev/null; then
              echo "::error title=Secret container missing::Run Apply n8n Infrastructure first so OpenTofu creates ${secret_name}."
              exit 1
            fi
          done

      - name: Generate runtime secret values
        run: |
          set -euo pipefail

          postgres_password="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"

          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${encryption_key}"

          printf '%s' "${postgres_password}" > "${RUNNER_TEMP}/n8n-postgres-password"
          printf '%s' "${encryption_key}" > "${RUNNER_TEMP}/n8n-encryption-key"
          chmod 0600 "${RUNNER_TEMP}/n8n-postgres-password" "${RUNNER_TEMP}/n8n-encryption-key"

      - name: Create or rotate Cloud SQL user
        run: |
          set -euo pipefail

          postgres_password="$(cat "${RUNNER_TEMP}/n8n-postgres-password")"

          if gcloud sql users list \
            --project="${N8N_GCP_PROJECT_ID}" \
            --instance="${N8N_SQL_INSTANCE}" \
            --format="value(name)" | grep -Fxq "${N8N_SQL_USER}"; then
            gcloud sql users set-password "${N8N_SQL_USER}" \
              --project="${N8N_GCP_PROJECT_ID}" \
              --instance="${N8N_SQL_INSTANCE}" \
              --password="${postgres_password}" \
              --quiet
          else
            gcloud sql users create "${N8N_SQL_USER}" \
              --project="${N8N_GCP_PROJECT_ID}" \
              --instance="${N8N_SQL_INSTANCE}" \
              --password="${postgres_password}" \
              --quiet
          fi

      - name: Add Secret Manager versions
        run: |
          set -euo pipefail

          gcloud secrets versions add "${N8N_POSTGRES_PASSWORD_SECRET}" \
            --project="${N8N_GCP_PROJECT_ID}" \
            --data-file="${RUNNER_TEMP}/n8n-postgres-password"

          gcloud secrets versions add "${N8N_ENCRYPTION_KEY_SECRET}" \
            --project="${N8N_GCP_PROJECT_ID}" \
            --data-file="${RUNNER_TEMP}/n8n-encryption-key"

      - name: Verify secret versions
        run: |
          set -euo pipefail

          for secret_name in "${N8N_POSTGRES_PASSWORD_SECRET}" "${N8N_ENCRYPTION_KEY_SECRET}"; do
            state="$(
              gcloud secrets versions describe latest \
                --project="${N8N_GCP_PROJECT_ID}" \
                --secret="${secret_name}" \
                --format="value(state)"
            )"

            if [ "${state}" != "ENABLED" ]; then
              echo "::error title=Secret version not enabled::${secret_name} latest version is ${state}"
              exit 1
            fi

            echo "${secret_name}: latest version is enabled"
          done

      - name: Scrub generated files
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/n8n-postgres-password" "${RUNNER_TEMP}/n8n-encryption-key"
