name: Cut over n8n to private Compute

on:
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: Type cutover-abpiv-n8n to authorize the approved maintenance-window cutover.
        required: true
        type: string
      confirm_runtime_secret_access:
        description: Type access-n8n-runtime-secrets to authorize purpose-limited Secret Manager reads on the VM.
        required: true
        type: string
      confirm_data_movement:
        description: Type move-verified-n8n-data to authorize the database and binary-data migration.
        required: true
        type: string
      confirm_dns_cutover:
        description: Type switch-n8n-dns-to-tunnel to authorize both production hostname changes.
        required: true
        type: string
      review_decision:
        description: Enter the independent review decision exactly as COMPLIANT / APPROVED / READY.
        required: true
        type: string
      reviewer_identity:
        description: Record the independent rigorous reviewer's GitHub handle or durable identity.
        required: true
        type: string
      acceptance_form_path:
        description: Existing read-only public form path beginning with /form/ for active edge verification; no submission is performed.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: abpiv-shared-runtime-mutation
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  GCP_PROJECT_ID: ${{ vars.N8N_GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  GCP_ZONE: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  VM_NAME: abpiv-runtime-vm
  CLOUD_RUN_SERVICE: abpiv-n8n
  CLOUD_SQL_INSTANCE: abpiv-n8n-postgres
  REVIEWER_IDENTITY: ${{ inputs.reviewer_identity }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: "true"
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  TF_VAR_gcp_zone: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  TF_VAR_runtime_origin: compute
  TF_VAR_legacy_stack_enabled: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  cutover:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_cutover == 'cutover-abpiv-n8n' &&
      inputs.confirm_runtime_secret_access == 'access-n8n-runtime-secrets' &&
      inputs.confirm_data_movement == 'move-verified-n8n-data' &&
      inputs.confirm_dns_cutover == 'switch-n8n-dns-to-tunnel' &&
      inputs.review_decision == 'COMPLIANT / APPROVED / READY' &&
      inputs.reviewer_identity != ''
    runs-on: ubuntu-latest
    environment: production-cutover
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1

      - id: target_size
        name: Bind this attempt to the accepted live VM size
        run: |
          set -euo pipefail
          machine_type="$(gcloud compute instances describe "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --format='value(machineType.basename())')"
          case "$machine_type" in
            e2-custom-medium-6144|e2-standard-2) ;;
            *) echo "Unexpected live VM machine type: $machine_type" >&2; exit 1 ;;
          esac
          echo "TF_VAR_compute_machine_type=$machine_type" >> "$GITHUB_ENV"
          echo "machine_type=$machine_type" >> "$GITHUB_OUTPUT"

      - id: window
        name: Start 60-minute window
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prove source and target n8n image digests match
        timeout-minutes: 5
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          trap 'rm -f "$service_json"' EXIT

          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > "$service_json"
          source_revision="$(
            python - "$service_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              service = json.load(handle)

          traffic = service.get("status", {}).get("traffic", [])
          serving = [entry for entry in traffic if int(entry.get("percent") or 0) > 0]
          if len(serving) != 1 or int(serving[0].get("percent") or 0) != 100:
              raise SystemExit("Cloud Run must have exactly one revision serving 100 percent of source traffic.")
          revision = serving[0].get("revisionName")
          if not revision:
              raise SystemExit("Cloud Run did not resolve the traffic-serving revision name.")
          print(revision)
          PY
          )"
          source_image_digest="$(gcloud run revisions describe "$source_revision" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.imageDigest)')"
          case "$source_image_digest" in
            *@sha256:*) source_digest="${source_image_digest##*@}" ;;
            sha256:*) source_digest="$source_image_digest" ;;
            *) echo "Cloud Run returned an invalid source image digest." >&2; exit 1 ;;
          esac
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          target_ref="$(sed -nE 's|^[[:space:]]*image:[[:space:]]+(docker\.io/n8nio/n8n@sha256:[0-9a-f]{64})[[:space:]]*$|\1|p' \
            infra/n8n/compute/docker-compose.yml)"
          if [ "$(printf '%s\n' "$target_ref" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "Expected exactly one pinned target n8n image reference." >&2
            exit 1
          fi
          target_digest="${target_ref##*@}"
          if [ "$source_digest" != "$target_digest" ]; then
            echo "Source and target n8n image digests do not match." >&2
            exit 1
          fi
          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo docker image inspect '$target_ref' >/dev/null"
          echo "Verified the traffic-serving source and prepared target use ${target_digest}." >> "$GITHUB_STEP_SUMMARY"

      - name: Create on-demand Cloud SQL backup
        timeout-minutes: 10
        run: |
          gcloud sql backups create --project "$GCP_PROJECT_ID" --instance "$CLOUD_SQL_INSTANCE" --description "pre-compute-cutover-${GITHUB_RUN_ID}" --quiet

      - name: Start private origin in maintenance mode
        timeout-minutes: 5
        run: |
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh maintenance"

      - id: dns
        name: Plan and apply only the two Tunnel DNS updates
        timeout-minutes: 10
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" init -input=false
          tofu -chdir="$TOFU_DIR" plan -input=false -out=cutover.tfplan
          tofu -chdir="$TOFU_DIR" show -json cutover.tfplan > cutover-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py cutover-plan.json --phase cutover
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve cutover.tfplan

      - name: Confirm public forms hostname reaches Tunnel maintenance mode
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "https://forms.allanbpediniv.com/form")"
            if [ "$status" = "503" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Forms hostname did not reach Tunnel maintenance mode." >&2
          exit 1

      - name: Quiesce Cloud Run and verify five minutes at zero
        timeout-minutes: 12
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --min 0 --max 1 --quiet
          infra/n8n/tools/wait-cloud-run-zero.sh

      - name: Export, checksum, restore, and compare database counts
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cloud_sql_host="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format='value(ipAddresses[0].ipAddress)')"
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "set -euo pipefail; migration_dir=\$(sudo env CLOUD_SQL_HOST='$cloud_sql_host' LEGACY_BINARY_BUCKET='${GCP_PROJECT_ID}-n8n-binary-data' CONFIRM_EXPORT=export-abpiv-n8n /opt/abpiv-n8n/scripts/export-cloud-sql.sh | tail -n1); sudo env MIGRATION_DIR=\"\$migration_dir\" CONFIRM_RESTORE=restore-abpiv-n8n /opt/abpiv-n8n/scripts/migrate-from-cloud-sql.sh"

      - name: Enforce minute-45 migration deadline
        run: |
          elapsed="$(( $(date +%s) - ${{ steps.window.outputs.start_epoch }} ))"
          if [ "$elapsed" -ge 2700 ]; then
            echo "Migration missed the minute-45 green deadline." >&2
            exit 1
          fi

      - name: Prove restored credentials decrypt while ingress remains sealed
        timeout-minutes: 5
        run: |
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/verify-restored-runtime.sh"

      - name: Start the verified runtime behind read-only precommit ingress
        timeout-minutes: 5
        run: |
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/prepare-cutover-runtime.sh"

      - name: Verify precommit public routing without opening any write path
        env:
          ACCEPTANCE_FORM_PATH: ${{ inputs.acceptance_form_path }}
        run: |
          set -euo pipefail
          case "$ACCEPTANCE_FORM_PATH" in
            /form/*) ;;
            *) echo "acceptance_form_path must begin with /form/." >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 15 \
            "https://forms.allanbpediniv.com${ACCEPTANCE_FORM_PATH}" >/dev/null
          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 \
            https://forms.allanbpediniv.com/rest/settings)"
          case "$blocked_status" in 403|404) ;; *) exit 1 ;; esac
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          test "$(curl --silent --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 15 \
            https://workflows.lobst3rs.com/)" = 302
          grep -Eqi '^location: .*\/cdn-cgi\/access\/' "$headers"

      - name: Enforce the minute-45 rollback boundary before write exposure
        run: |
          elapsed="$(( $(date +%s) - ${{ steps.window.outputs.start_epoch }} ))"
          test "$elapsed" -lt 2700

      - id: commit
        name: Make the restored target canonical before exposing write paths
        run: echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open write paths only on the canonical private runtime
        timeout-minutes: 5
        run: |
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh active && sudo /opt/abpiv-n8n/scripts/verify-runtime.sh"

      - name: Verify active public routing and Access enforcement without submission
        env:
          ACCEPTANCE_FORM_PATH: ${{ inputs.acceptance_form_path }}
        run: |
          set -euo pipefail
          case "$ACCEPTANCE_FORM_PATH" in
            /form/*) ;;
            *) echo "acceptance_form_path must begin with /form/." >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 15 \
            "https://forms.allanbpediniv.com${ACCEPTANCE_FORM_PATH}" >/dev/null
          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 \
            https://forms.allanbpediniv.com/rest/settings)"
          case "$blocked_status" in
            403|404) ;;
            *) echo "Forms hostname exposed an editor/API path with status ${blocked_status}." >&2; exit 1 ;;
          esac
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          editor_status="$(curl --silent --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 15 \
            https://workflows.lobst3rs.com/)"
          test "$editor_status" = "302"
          grep -Eqi '^location: .*\/cdn-cgi\/access\/' "$headers"

      - id: observe
        name: Observe smaller VM for at least 15 minutes
        continue-on-error: true
        timeout-minutes: 20
        run: |
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo env OBSERVATION_SECONDS=900 /opt/abpiv-n8n/scripts/observe-runtime.sh"

      - id: resize_modes
        name: Capture the other runtime mode before resizing the shared host
        if: steps.observe.outcome == 'failure' && steps.target_size.outputs.machine_type == 'e2-custom-medium-6144'
        run: |
          set -euo pipefail
          plausible_mode="$(gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "if sudo test -f /etc/abpiv-plausible/mode; then sudo cat /etc/abpiv-plausible/mode; else printf stopped; fi")"
          case "$plausible_mode" in active|maintenance|stopped) ;; *) exit 1 ;; esac
          echo "plausible_mode=$plausible_mode" >> "$GITHUB_OUTPUT"

      - name: Resize in place if the smaller VM misses a threshold
        if: steps.observe.outcome == 'failure' && steps.target_size.outputs.machine_type == 'e2-custom-medium-6144'
        timeout-minutes: 25
        run: |
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh stopped"
          gcloud compute instances stop "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --quiet
          gcloud compute instances set-machine-type "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --machine-type e2-standard-2 --quiet
          gcloud compute instances start "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --quiet
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "until sudo test -f /var/lib/abpiv-n8n-bootstrap-complete && sudo systemctl is-active --quiet docker; do sleep 5; done; case '${{ steps.resize_modes.outputs.plausible_mode }}' in active|maintenance) sudo /opt/abpiv-plausible/scripts/runtime-mode.sh '${{ steps.resize_modes.outputs.plausible_mode }}' ;; stopped) ;; *) exit 1 ;; esac"
          echo "TF_VAR_compute_machine_type=e2-standard-2" >> "$GITHUB_ENV"
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh active && sudo /opt/abpiv-n8n/scripts/verify-runtime.sh && sudo env OBSERVATION_SECONDS=900 /opt/abpiv-n8n/scripts/observe-runtime.sh"

      - name: Fail closed if the approved fallback itself misses an observation threshold
        if: steps.observe.outcome == 'failure' && steps.target_size.outputs.machine_type == 'e2-standard-2'
        run: |
          echo "The approved e2-standard-2 fallback missed a shared-host threshold." >&2
          exit 1

      - name: Create and verify the first post-cutover backup
        timeout-minutes: 10
        run: |
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/backup.sh"

      - name: Record automated migration state with manual acceptance still closed
        run: |
          elapsed="$(( $(date +%s) - ${{ steps.window.outputs.start_epoch }} ))"
          test "$elapsed" -lt 3600
          echo "Automated migration checks passed in ${elapsed} seconds after review by ${REVIEWER_IDENTITY}. Manual n8n login and read-only MCP acceptance remain mandatory before the separately gated legacy destruction." >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back before destruction on any cutover failure
        if: failure() && steps.dns.outputs.attempted == 'true' && steps.commit.outputs.committed != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if ! gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh stopped"; then
            echo "VM stop failed; continuing with the fail-closed origin rollback." >&2
          fi
          export TF_VAR_runtime_origin=cloud_run
          tofu -chdir="$TOFU_DIR" init -input=false
          tofu -chdir="$TOFU_DIR" plan -input=false -out=rollback.tfplan
          tofu -chdir="$TOFU_DIR" show -json rollback.tfplan > rollback-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py rollback-plan.json --phase rollback
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve rollback.tfplan
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode -out=rollback-verify.tfplan
          exit 1

      - name: Recover the canonical target without reversing post-activation data
        if: failure() && steps.commit.outputs.committed == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          vm_status="$(gcloud compute instances describe "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --format='value(status)')"
          if [ "$vm_status" != RUNNING ]; then
            gcloud compute instances start "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --quiet
          fi
          gcloud compute ssh "$VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "set -euo pipefail; until sudo test -f /var/lib/abpiv-n8n-bootstrap-complete && sudo systemctl is-active --quiet docker; do sleep 5; done; plausible_mode='${{ steps.resize_modes.outputs.plausible_mode }}'; if test -n \"\$plausible_mode\"; then case \"\$plausible_mode\" in active|maintenance) sudo /opt/abpiv-plausible/scripts/runtime-mode.sh \"\$plausible_mode\" ;; stopped) sudo /opt/abpiv-plausible/scripts/runtime-mode.sh stopped ;; *) exit 1 ;; esac; fi; sudo /opt/abpiv-n8n/scripts/runtime-mode.sh active; sudo /opt/abpiv-n8n/scripts/verify-runtime.sh"
          echo "Post-activation failure left the restored n8n target canonical; stale Cloud SQL was intentionally not re-exposed." >&2
          exit 1
