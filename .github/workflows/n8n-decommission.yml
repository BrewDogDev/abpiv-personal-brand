name: Plan or apply reviewed n8n legacy decommission

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate the destruction manifest first; apply only in a later dispatch.
        required: true
        type: choice
        options: [plan, apply]
      confirm_destroy:
        description: In apply mode, type destroy-reviewed-legacy-n8n.
        required: false
        type: string
      review_decision:
        description: In apply mode, enter COMPLIANT / APPROVED / READY from the same rigorous reviewer.
        required: false
        type: string
      reviewer_identity:
        description: Record the same independent reviewer's GitHub handle or durable identity.
        required: true
        type: string
      reviewed_commit_sha:
        description: In apply mode, enter the exact 40-character commit SHA from the reviewed plan dispatch.
        required: false
        type: string
      reviewed_allowlist_sha256:
        description: In apply mode, enter the SHA-256 printed by the reviewed plan dispatch.
        required: false
        type: string
      confirm_acceptance:
        description: Confirm approved editor Access, n8n login, stored-credential decryption, and read-only MCP inventory checks passed.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: abpiv-shared-runtime-mutation
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  GCP_ZONE: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  VM_NAME: abpiv-runtime-vm
  REVIEWER_IDENTITY: ${{ inputs.reviewer_identity }}
  REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: "true"
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  TF_VAR_gcp_zone: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  TF_VAR_runtime_origin: compute
  TF_VAR_legacy_cloud_run_min_instances: "0"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  decommission:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (inputs.mode == 'plan' && inputs.reviewer_identity != '' && inputs.confirm_acceptance == 'credential-and-read-only-mcp-acceptance-passed') ||
        (inputs.mode == 'apply' && inputs.reviewer_identity != '' && inputs.confirm_acceptance == 'credential-and-read-only-mcp-acceptance-passed' && inputs.confirm_destroy == 'destroy-reviewed-legacy-n8n' && inputs.review_decision == 'COMPLIANT / APPROVED / READY' && inputs.reviewed_commit_sha != '' && inputs.reviewed_allowlist_sha256 != '')
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && 'production-destruction' || 'production-plan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1

      - name: Bind apply to the exact reviewed commit
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT_SHA"

      - name: Bind the plan to the accepted live VM size
        run: |
          machine_type="$(gcloud compute instances describe "$VM_NAME" --project "$TF_VAR_gcp_project_id" --zone "$GCP_ZONE" --format='value(machineType.basename())')"
          case "$machine_type" in
            e2-custom-medium-6144|e2-standard-2) ;;
            *) echo "Unexpected live VM machine type: $machine_type" >&2; exit 1 ;;
          esac
          echo "TF_VAR_compute_machine_type=$machine_type" >> "$GITHUB_ENV"

      - id: retained_migration
        name: Round-trip the complete retained migration package before destruction
        run: |
          set -euo pipefail
          backup_root="gs://${TF_VAR_gcp_project_id}-n8n-backups/migration"
          manifest_uri="$(gcloud storage ls "${backup_root}/**/SHA256SUMS" | LC_ALL=C sort | tail -n1)"
          migration_prefix="${manifest_uri%/SHA256SUMS}"
          timestamp="${migration_prefix##*/}"
          test "${migration_prefix%/*}" = "$backup_root"
          [[ "$timestamp" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]

          verify_dir="$(mktemp -d "${RUNNER_TEMP}/n8n-retained-migration.XXXXXX")"
          trap 'rm -rf -- "$verify_dir"' EXIT
          required=(database.dump binary-data.tar binary-checksums.txt source-binary-count.txt source-counts.tsv SHA256SUMS)
          for name in "${required[@]}"; do
            gcloud storage cp "${migration_prefix}/${name}" "$verify_dir/$name" >/dev/null
          done
          (
            cd "$verify_dir"
            expected_names="$(printf '%s\n' database.dump binary-data.tar binary-checksums.txt source-binary-count.txt source-counts.tsv | LC_ALL=C sort)"
            actual_names="$(awk 'NF == 2 { sub(/^\\*/, "", $2); print $2 }' SHA256SUMS | LC_ALL=C sort)"
            test "$(wc -l < SHA256SUMS)" -eq 5
            test "$actual_names" = "$expected_names"
            sha256sum --check SHA256SUMS >/dev/null
          )
          migration_manifest_sha256="$(sha256sum "$verify_dir/SHA256SUMS" | cut -d' ' -f1)"
          echo "prefix=$migration_prefix" >> "$GITHUB_OUTPUT"
          echo "migration_manifest_sha256=$migration_manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "Round-trip verified ${migration_prefix} with manifest ${migration_manifest_sha256}." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate fresh arming and full-root destruction plans
        env:
          MIGRATION_PREFIX: ${{ steps.retained_migration.outputs.prefix }}
          MIGRATION_MANIFEST_SHA256: ${{ steps.retained_migration.outputs.migration_manifest_sha256 }}
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" init -input=false

          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -var='legacy_stack_enabled=true' \
            -var='legacy_destruction_armed=true' \
            -out=arm.tfplan
          tofu -chdir="$TOFU_DIR" show -json arm.tfplan > arm-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py arm-plan.json --phase arm

          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -var='legacy_stack_enabled=false' \
            -var='legacy_destruction_armed=false' \
            -out=destroy-preview.tfplan
          tofu -chdir="$TOFU_DIR" show -json destroy-preview.tfplan > destroy-preview-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py destroy-preview-plan.json --phase destroy
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' destroy-preview-plan.json \
            | LC_ALL=C sort > destroy-actions-only.txt
          {
            echo "arm google_sql_database_instance.n8n[0] deletion_protection=false"
            cat destroy-actions-only.txt
            echo "delete-objects gs://${TF_VAR_gcp_project_id}-n8n-binary-data/**"
            echo "commit ${GITHUB_SHA}"
            echo "migration-backup ${MIGRATION_PREFIX} ${MIGRATION_MANIFEST_SHA256}"
            echo "reviewer ${REVIEWER_IDENTITY}"
          } | LC_ALL=C sort > destruction-actions.txt
          sha256sum destruction-actions.txt | tee destruction-actions.sha256
          cat destruction-actions.txt >> "$GITHUB_STEP_SUMMARY"
          cat destruction-actions.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Match the same reviewer's approved manifest
        if: inputs.mode == 'apply'
        env:
          REVIEWED_ALLOWLIST_SHA256: ${{ inputs.reviewed_allowlist_sha256 }}
        run: |
          actual="$(cut -d' ' -f1 destruction-actions.sha256)"
          test "$actual" = "$REVIEWED_ALLOWLIST_SHA256"

      - name: Write Cloud SQL deletion protection false into state
        id: arm
        if: inputs.mode == 'apply'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve arm.tfplan

      - name: Regenerate and match the post-arming destruction plan
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -var='legacy_stack_enabled=false' \
            -var='legacy_destruction_armed=false' \
            -out=destroy.tfplan
          tofu -chdir="$TOFU_DIR" show -json destroy.tfplan > destroy-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py destroy-plan.json --phase destroy
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' destroy-plan.json \
            | LC_ALL=C sort > destroy-actions-final.txt
          cmp --silent destroy-actions-only.txt destroy-actions-final.txt

      - name: Remove verified objects from the exact legacy binary bucket
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          legacy_bucket="gs://${TF_VAR_gcp_project_id}-n8n-binary-data"
          if gcloud storage ls "${legacy_bucket}/**" >/dev/null 2>&1; then
            gcloud storage rm --recursive "${legacy_bucket}/**"
          fi

      - name: Apply only the freshly regenerated and hash-matched plan
        id: destroy
        if: inputs.mode == 'apply'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve destroy.tfplan

      - name: Re-enable Cloud SQL deletion protection after a failed decommission
        if: failure() && inputs.mode == 'apply' && steps.arm.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! gcloud sql instances describe abpiv-n8n-postgres --project "$TF_VAR_gcp_project_id" >/dev/null 2>&1; then
            echo "Cloud SQL is already absent; state-only deletion protection cannot be restored." >&2
            exit 0
          fi
          tofu -chdir="$TOFU_DIR" plan -input=false \
            -var='legacy_stack_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -target='google_sql_database_instance.n8n[0]' \
            -out=protect.tfplan
          tofu -chdir="$TOFU_DIR" show -json protect.tfplan > protect-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py protect-plan.json --phase protect
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve protect.tfplan
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode \
            -var='legacy_stack_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -target='google_sql_database_instance.n8n[0]' \
            -out=protect-verify.tfplan

      - name: Remove runtime artifacts from the runner
        if: always()
        run: rm -f arm.tfplan arm-plan.json protect.tfplan protect-plan.json protect-verify.tfplan destroy-preview.tfplan destroy-preview-plan.json destroy.tfplan destroy-plan.json destroy-actions-only.txt destroy-actions-final.txt destruction-actions.txt destruction-actions.sha256
