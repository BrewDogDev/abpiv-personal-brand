name: Fresh-start n8n on private Compute

on:
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: Type cutover-fresh-n8n to authorize this production cutover.
        required: true
        type: string
      confirm_fresh_start:
        description: Type start-empty-n8n to confirm that no legacy n8n data will be copied.
        required: true
        type: string
      confirm_runtime_secret_access:
        description: Type access-n8n-runtime-secrets to authorize the VM runtime Secret Manager reads.
        required: true
        type: string
      confirm_dns_cutover:
        description: Type switch-n8n-dns-to-tunnel to authorize both production hostname changes.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: abpiv-shared-runtime-mutation
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  GCP_PROJECT_ID: ${{ vars.N8N_GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  GCP_ZONE: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  VM_NAME: abpiv-runtime-vm
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: "true"
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  TF_VAR_gcp_zone: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  TF_VAR_runtime_origin: compute
  TF_VAR_legacy_stack_enabled: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  cutover:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_cutover == 'cutover-fresh-n8n' &&
      inputs.confirm_fresh_start == 'start-empty-n8n' &&
      inputs.confirm_runtime_secret_access == 'access-n8n-runtime-secrets' &&
      inputs.confirm_dns_cutover == 'switch-n8n-dns-to-tunnel'
    runs-on: ubuntu-latest
    environment: production-cutover
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Reserve the recovery window
        run: echo "CUTOVER_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: opentofu/setup-opentofu@v1

      - name: Check production configuration
        timeout-minutes: 1
        run: |
          set -euo pipefail
          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ZONE \
            TF_VAR_cloudflare_account_id \
            TF_VAR_allanbpediniv_zone_id \
            TF_VAR_editor_hostname \
            TF_VAR_editor_zone_id \
            CLOUDFLARE_API_TOKEN
          do
            test -n "${!name}"
          done

      - id: target
        name: Bind to the prepared stopped target
        timeout-minutes: 5
        run: |
          set -euo pipefail
          machine_type="$(gcloud compute instances describe "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --format='value(machineType.basename())')"
          case "$machine_type" in
            e2-custom-medium-6144|e2-standard-2) ;;
            *) echo "Unexpected live VM machine type: $machine_type" >&2; exit 1 ;;
          esac
          echo "TF_VAR_compute_machine_type=$machine_type" >> "$GITHUB_ENV"

          runtime_mode="$(gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet \
            --command 'sudo cat /etc/abpiv-n8n/mode')"
          if [ "$runtime_mode" != stopped ]; then
            echo "Fresh cutover requires the prepared n8n target to be stopped; found ${runtime_mode}." >&2
            exit 1
          fi

      - name: Upload the exact runtime release over IAP
        timeout-minutes: 5
        run: |
          set -euo pipefail
          archive="$(mktemp --suffix=.tgz)"
          trap 'rm -f "$archive"' EXIT
          tar --create --gzip --file "$archive" --directory infra/n8n compute
          gcloud compute scp "$archive" "${VM_NAME}:/tmp/abpiv-n8n-release.tgz" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet

      - name: Install the exact runtime release while stopped
        timeout-minutes: 5
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet --command \
            "sudo rm -rf /tmp/abpiv-n8n-release && sudo mkdir -p /tmp/abpiv-n8n-release && sudo tar -xzf /tmp/abpiv-n8n-release.tgz -C /tmp/abpiv-n8n-release --strip-components=1 && sudo env RELEASE_DIR=/tmp/abpiv-n8n-release /tmp/abpiv-n8n-release/scripts/deploy-release.sh"

      - id: activation
        name: Start and prove the empty private runtime before DNS
        timeout-minutes: 10
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh maintenance && sudo /opt/abpiv-n8n/scripts/assert-fresh-runtime.sh && sudo /opt/abpiv-n8n/scripts/runtime-mode.sh active && sudo /opt/abpiv-n8n/scripts/verify-runtime.sh && sudo /opt/abpiv-n8n/scripts/assert-fresh-runtime.sh"

      - id: dns
        name: Plan and apply only the two Tunnel DNS updates
        timeout-minutes: 10
        run: |
          set -euo pipefail
          elapsed_seconds=$(( $(date +%s) - CUTOVER_STARTED_EPOCH ))
          if [ "$elapsed_seconds" -ge 2400 ]; then
            echo "Refusing to begin DNS cutover after ${elapsed_seconds}s; the reserved recovery window would be too short." >&2
            exit 1
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          tofu -chdir="$TOFU_DIR" init -input=false
          tofu -chdir="$TOFU_DIR" plan -input=false -out=fresh-cutover.tfplan
          tofu -chdir="$TOFU_DIR" show -json fresh-cutover.tfplan > fresh-cutover-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py fresh-cutover-plan.json --phase cutover
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve fresh-cutover.tfplan

      - name: Verify the new production origin and OpenTofu convergence
        timeout-minutes: 5
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode -out=fresh-cutover-verify.tfplan

          cf_access_client_id="$(tofu -chdir="$TOFU_DIR" output -raw n8n_mcp_cf_access_client_id)"
          cf_access_client_secret="$(tofu -chdir="$TOFU_DIR" output -raw n8n_mcp_cf_access_client_secret)"
          origin_body=""
          for _ in $(seq 1 12); do
            if origin_body="$(curl --fail --silent --show-error --max-time 15 \
              --header 'Cache-Control: no-cache' \
              --header "CF-Access-Client-Id: ${cf_access_client_id}" \
              --header "CF-Access-Client-Secret: ${cf_access_client_secret}" \
              "https://workflows.lobst3rs.com/healthz?cutover=${GITHUB_SHA}")" && [ "$origin_body" = active-ready ]; then
              break
            fi
            sleep 5
          done
          unset cf_access_client_id cf_access_client_secret
          if [ "$origin_body" != active-ready ]; then
            echo "Cloudflare did not reach the target-only active health response." >&2
            exit 1
          fi

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          editor_status="$(curl --silent --output /dev/null --dump-header "$headers" \
            --write-out '%{http_code}' --max-time 15 https://workflows.lobst3rs.com/)"
          test "$editor_status" = 302
          grep -Eqi '^location: .*\/cdn-cgi\/access\/' "$headers"

          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 15 https://forms.allanbpediniv.com/rest/settings)"
          case "$blocked_status" in
            403|404) ;;
            *) echo "Forms hostname exposed an editor/API path with status ${blocked_status}." >&2; exit 1 ;;
          esac

          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/verify-runtime.sh"

      - id: commit
        name: Record the fresh private runtime as canonical
        timeout-minutes: 1
        run: |
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "Production now targets the fresh private n8n runtime. Owner setup, credentials, workflows, and endpoint checks remain manual acceptance steps." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the Cloud Run origin and stop the target on precommit failure
        if: (failure() || cancelled()) && steps.dns.outputs.attempted == 'true' && steps.commit.outputs.committed != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export TF_VAR_runtime_origin=cloud_run
          tofu -chdir="$TOFU_DIR" init -input=false
          tofu -chdir="$TOFU_DIR" plan -input=false -out=fresh-rollback.tfplan
          tofu -chdir="$TOFU_DIR" show -json fresh-rollback.tfplan > fresh-rollback-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py fresh-rollback-plan.json --phase rollback
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve fresh-rollback.tfplan
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode -out=fresh-rollback-verify.tfplan
          timeout 120s gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh stopped" || true
          exit 1

      - name: Stop the target when activation fails before DNS
        if: (failure() || cancelled()) && steps.activation.outputs.attempted == 'true' && steps.dns.outputs.attempted != 'true'
        timeout-minutes: 5
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet --command \
            "sudo /opt/abpiv-n8n/scripts/runtime-mode.sh stopped"
          exit 1

      - name: Remove remote release artifacts
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet --command \
            "sudo rm -rf -- /tmp/abpiv-n8n-release /tmp/abpiv-n8n-release.tgz"
