name: Plan or apply fresh-start n8n legacy destruction

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate the destruction manifest first; apply only in a later dispatch.
        required: true
        type: choice
        options: [plan, apply]
      confirm_acceptance:
        description: Confirm the fresh Compute runtime passed Allan's manual owner, credential, workflow, and endpoint acceptance.
        required: true
        type: string
      confirm_abandoned_data:
        description: Confirm the abandoned Cloud SQL and legacy bucket data may be destroyed without inspection, export, or backup.
        required: true
        type: string
      confirm_destroy:
        description: In apply mode, type destroy-abandoned-fresh-start-legacy-n8n.
        required: false
        type: string
      review_decision:
        description: In apply mode, enter COMPLIANT / APPROVED / READY from the same rigorous reviewer.
        required: false
        type: string
      reviewer_identity:
        description: Record the same independent reviewer's GitHub handle or durable identity.
        required: true
        type: string
      reviewed_commit_sha:
        description: In apply mode, enter the exact 40-character commit SHA from the reviewed plan dispatch.
        required: false
        type: string
      reviewed_allowlist_sha256:
        description: In apply mode, enter the SHA-256 printed by the reviewed plan dispatch.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: abpiv-shared-runtime-mutation
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  GCP_REGION: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  GCP_ZONE: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  VM_NAME: abpiv-runtime-vm
  CLOUD_RUN_SERVICE: abpiv-n8n
  DEPLOYER_SERVICE_ACCOUNT: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
  REVIEWER_IDENTITY: ${{ inputs.reviewer_identity }}
  REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
  ABANDONED_DATA_CONFIRMATION: ${{ inputs.confirm_abandoned_data }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: "true"
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  TF_VAR_gcp_zone: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  TF_VAR_runtime_origin: compute
  TF_VAR_legacy_cloud_run_min_instances: "0"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  decommission:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_acceptance == 'fresh-runtime-manual-acceptance-passed' &&
      inputs.confirm_abandoned_data == 'fresh-start-abandoned-data-authorized' &&
      inputs.reviewer_identity != '' &&
      (
        inputs.mode == 'plan' ||
        (
          inputs.mode == 'apply' &&
          inputs.confirm_destroy == 'destroy-abandoned-fresh-start-legacy-n8n' &&
          inputs.review_decision == 'COMPLIANT / APPROVED / READY' &&
          inputs.reviewed_commit_sha != '' &&
          inputs.reviewed_allowlist_sha256 != ''
        )
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && 'production-destruction' || 'production-plan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1

      - name: Bind apply to the exact reviewed commit
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT_SHA"

      - name: Verify the accepted Compute runtime and disabled Cloud Run service
        run: |
          set -euo pipefail
          machine_type="$(gcloud compute instances describe "$VM_NAME" --project "$TF_VAR_gcp_project_id" --zone "$GCP_ZONE" --format='value(machineType.basename())')"
          case "$machine_type" in
            e2-custom-medium-6144|e2-standard-2) ;;
            *) echo "Unexpected live VM machine type: $machine_type" >&2; exit 1 ;;
          esac
          echo "TF_VAR_compute_machine_type=$machine_type" >> "$GITHUB_ENV"

          gcloud compute ssh "$VM_NAME" --project "$TF_VAR_gcp_project_id" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "set -euo pipefail; test \"\$(sudo cat /etc/abpiv-n8n/mode)\" = active; test \"\$(sudo systemctl is-active abpiv-cloudflared.service)\" = active; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-postgres-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-n8n-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-nginx-1)\" = healthy; test \"\$(sudo curl --fail --silent --show-error --header 'Host: workflows.lobst3rs.com' http://127.0.0.1:8080/healthz)\" = active-ready"

          cloud_run_services_json="$(gcloud run services list --project "$TF_VAR_gcp_project_id" --region "$GCP_REGION" --format=json)"
          cloud_run_matches_json="$(jq --arg name "$CLOUD_RUN_SERVICE" '[.[] | select(.metadata.name == $name)]' <<<"$cloud_run_services_json")"
          cloud_run_count="$(jq --raw-output 'length' <<<"$cloud_run_matches_json")"
          case "$cloud_run_count" in
            0)
              echo "Cloud Run is already absent after a partial decommission; continuing the reviewed recovery path."
              ;;
            1)
              cloud_run_json="$(jq '.[0]' <<<"$cloud_run_matches_json")"
              test "$(jq --raw-output '.metadata.annotations["run.googleapis.com/scalingMode"] // ""' <<<"$cloud_run_json")" = manual
              test "$(jq --raw-output '.metadata.annotations["run.googleapis.com/manualInstanceCount"] // ""' <<<"$cloud_run_json")" = 0
              ;;
            *)
              echo "Found multiple Cloud Run services matching ${CLOUD_RUN_SERVICE}." >&2
              exit 1
              ;;
          esac

          sql_instances_json="$(gcloud sql instances list --project "$TF_VAR_gcp_project_id" --format=json)"
          legacy_sql_count="$(jq '[.[] | select(.name == "abpiv-n8n-postgres")] | length' <<<"$sql_instances_json")"
          case "$legacy_sql_count" in
            0)
              echo "LEGACY_SQL_EXISTS=false" >> "$GITHUB_ENV"
              echo "Cloud SQL is already absent after a partial decommission; no arming plan is required."
              ;;
            1)
              echo "LEGACY_SQL_EXISTS=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Found an unexpected number of matching Cloud SQL instances: ${legacy_sql_count}." >&2
              exit 1
              ;;
          esac

          editor_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "https://${TF_VAR_editor_hostname}/")"
          test "$editor_status" = 302
          forms_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://forms.allanbpediniv.com/rest/settings')"
          case "$forms_status" in
            403|404) ;;
            *) echo "Unexpected forms API status: $forms_status" >&2; exit 1 ;;
          esac

      - name: Generate fresh arming and full-root destruction plans
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" init -input=false

          if test "$LEGACY_SQL_EXISTS" = true; then
            tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
              -var='legacy_stack_enabled=true' \
              -var='legacy_deployer_permissions_enabled=true' \
              -var='legacy_destruction_armed=true' \
              -target='google_sql_database_instance.n8n[0]' \
              -out=arm.tfplan
            tofu -chdir="$TOFU_DIR" show -json arm.tfplan > arm-plan.json
            python infra/n8n/tools/assert-plan-allowlist.py arm-plan.json --phase arm
          fi

          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -var='legacy_stack_enabled=false' \
            -var='legacy_deployer_permissions_enabled=false' \
            -var='legacy_destruction_armed=false' \
            -out=destroy-preview.tfplan
          tofu -chdir="$TOFU_DIR" show -json destroy-preview.tfplan > destroy-preview-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py destroy-preview-plan.json --phase destroy
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' destroy-preview-plan.json \
            | LC_ALL=C sort > destroy-actions-only.txt
          grep -v '^delete google_project_iam_member\.github_deployer_project_roles\[' destroy-actions-only.txt > destroy-resource-actions-expected.txt || true
          grep '^delete google_project_iam_member\.github_deployer_project_roles\[' destroy-actions-only.txt > destroy-permission-actions-expected.txt || true

          temp_cert_permission_required=false
          if grep -Eq '^delete google_certificate_manager_certificate_map(_entry)?\.' destroy-actions-only.txt; then
            temp_cert_permission_required=true
          fi
          echo "TEMP_CERT_PERMISSION_REQUIRED=${temp_cert_permission_required}" >> "$GITHUB_ENV"

          {
            if test "$LEGACY_SQL_EXISTS" = true; then
              echo "arm google_sql_database_instance.n8n[0] deletion_protection=false"
            fi
            if test "$temp_cert_permission_required" = true; then
              echo "grant-temporary-certificate-map-delete roles/certificatemanager.owner serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
            fi
            echo "revoke-temporary-certificate-map-delete roles/certificatemanager.owner serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
            cat destroy-actions-only.txt
            echo "delete-objects gs://${TF_VAR_gcp_project_id}-n8n-binary-data/**"
            echo "commit ${GITHUB_SHA}"
            echo "fresh-start-abandoned-data ${ABANDONED_DATA_CONFIRMATION}"
            echo "reviewer ${REVIEWER_IDENTITY}"
          } | LC_ALL=C sort > destruction-actions.txt
          sha256sum destruction-actions.txt | tee destruction-actions.sha256
          tee -a "$GITHUB_STEP_SUMMARY" < destruction-actions.txt
          tee -a "$GITHUB_STEP_SUMMARY" < destruction-actions.sha256

      - name: Match the same reviewer's approved manifest
        if: inputs.mode == 'apply'
        env:
          REVIEWED_ALLOWLIST_SHA256: ${{ inputs.reviewed_allowlist_sha256 }}
        run: |
          set -euo pipefail
          actual="$(cut -d' ' -f1 destruction-actions.sha256)"
          test "$actual" = "$REVIEWED_ALLOWLIST_SHA256"

      - name: Grant the reviewed temporary Certificate Manager owner permission
        id: temp_cert_permission
        if: inputs.mode == 'apply' && env.TEMP_CERT_PERMISSION_REQUIRED == 'true'
        run: |
          set -euo pipefail
          member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
          gcloud projects add-iam-policy-binding "$TF_VAR_gcp_project_id" \
            --member="$member" \
            --role="roles/certificatemanager.owner" \
            --condition=None \
            --quiet >/dev/null
          bindings="$(gcloud projects get-iam-policy "$TF_VAR_gcp_project_id" \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/certificatemanager.owner' \
            --format='value(bindings.members)')"
          grep -Fxq "$member" <<<"$bindings"
          sleep 30

      - name: Write Cloud SQL deletion protection false into state
        id: arm
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if test "$LEGACY_SQL_EXISTS" != true; then
            echo "Cloud SQL is already absent; skipping the arming apply."
            exit 0
          fi
          test -f "$TOFU_DIR/arm.tfplan"
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve arm.tfplan

      - name: Regenerate and match the post-arming resource-destruction plan
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -var='legacy_stack_enabled=false' \
            -var='legacy_deployer_permissions_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -out=destroy-resources.tfplan
          tofu -chdir="$TOFU_DIR" show -json destroy-resources.tfplan > destroy-resources-plan.json
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' destroy-resources-plan.json \
            | LC_ALL=C sort > destroy-resource-actions-final.txt
          if test -s destroy-resource-actions-final.txt; then
            python infra/n8n/tools/assert-plan-allowlist.py destroy-resources-plan.json --phase destroy
          fi
          cmp --silent destroy-resource-actions-expected.txt destroy-resource-actions-final.txt

      - name: Remove objects from the exact abandoned legacy binary bucket
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          legacy_bucket="gs://${TF_VAR_gcp_project_id}-n8n-binary-data"
          # Do not pre-list or emit abandoned object metadata. The reviewed
          # force_destroy=false bucket deletion fails if any object survives.
          gcloud storage rm --recursive "${legacy_bucket}/**" --all-versions >/dev/null 2>&1 || true

      - name: Apply only the freshly regenerated and hash-matched resource plan
        id: destroy
        if: inputs.mode == 'apply'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve destroy-resources.tfplan

      - name: Revoke the temporary Certificate Manager owner permission
        id: temp_cert_permission_cleanup
        if: always() && inputs.mode == 'apply'
        run: |
          set -euo pipefail
          member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
          for _ in 1 2 3; do
            bindings="$(gcloud projects get-iam-policy "$TF_VAR_gcp_project_id" \
              --flatten='bindings[].members' \
              --filter='bindings.role=roles/certificatemanager.owner' \
              --format='value(bindings.members)')"
            if ! grep -Fxq "$member" <<<"$bindings"; then
              exit 0
            fi
            gcloud projects remove-iam-policy-binding "$TF_VAR_gcp_project_id" \
              --member="$member" \
              --role="roles/certificatemanager.owner" \
              --condition=None \
              --quiet >/dev/null || true
            sleep 5
          done
          bindings="$(gcloud projects get-iam-policy "$TF_VAR_gcp_project_id" \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/certificatemanager.owner' \
            --format='value(bindings.members)')"
          if grep -Fxq "$member" <<<"$bindings"; then
            echo "Temporary Certificate Manager owner permission still exists." >&2
            exit 1
          fi

      - name: Verify legacy GCP resources are absent while deletion permissions remain
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          cloud_run_services_json="$(gcloud run services list --project "$TF_VAR_gcp_project_id" --region "$GCP_REGION" --format=json)"
          test "$(jq --arg name "$CLOUD_RUN_SERVICE" '[.[] | select(.metadata.name == $name)] | length' <<<"$cloud_run_services_json")" -eq 0
          sql_instances_json="$(gcloud sql instances list --project "$TF_VAR_gcp_project_id" --format=json)"
          test "$(jq '[.[] | select(.name == "abpiv-n8n-postgres")] | length' <<<"$sql_instances_json")" -eq 0
          bucket_names="$(gcloud storage buckets list --project "$TF_VAR_gcp_project_id" --format='value(name)')"
          if grep -Fxq "${TF_VAR_gcp_project_id}-n8n-binary-data" <<<"$bucket_names"; then
            echo "Deprecated binary-data bucket still exists." >&2
            exit 1
          fi

          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode \
            -var='legacy_stack_enabled=false' \
            -var='legacy_deployer_permissions_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -out=destroy-resources-verify.tfplan

      - name: Regenerate and match the obsolete-permission removal plan
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -var='legacy_stack_enabled=false' \
            -var='legacy_deployer_permissions_enabled=false' \
            -var='legacy_destruction_armed=false' \
            -out=destroy-permissions.tfplan
          tofu -chdir="$TOFU_DIR" show -json destroy-permissions.tfplan > destroy-permissions-plan.json
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' destroy-permissions-plan.json \
            | LC_ALL=C sort > destroy-permission-actions-final.txt
          if test -s destroy-permission-actions-final.txt; then
            python infra/n8n/tools/assert-plan-allowlist.py destroy-permissions-plan.json --phase destroy
          fi
          cmp --silent destroy-permission-actions-expected.txt destroy-permission-actions-final.txt

      - name: Apply only the freshly regenerated obsolete-permission plan
        id: permissions
        if: inputs.mode == 'apply'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve destroy-permissions.tfplan

      - name: Verify full convergence and retained production runtime
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode \
            -var='legacy_stack_enabled=false' \
            -var='legacy_deployer_permissions_enabled=false' \
            -var='legacy_destruction_armed=false' \
            -out=destroy-verify.tfplan

          gcloud compute ssh "$VM_NAME" --project "$TF_VAR_gcp_project_id" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "set -euo pipefail; test \"\$(sudo cat /etc/abpiv-n8n/mode)\" = active; test \"\$(sudo systemctl is-active abpiv-cloudflared.service)\" = active; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-postgres-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-n8n-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-nginx-1)\" = healthy; test \"\$(sudo curl --fail --silent --show-error --header 'Host: workflows.lobst3rs.com' http://127.0.0.1:8080/healthz)\" = active-ready"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "https://${TF_VAR_editor_hostname}/")" = 302
          forms_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://forms.allanbpediniv.com/rest/settings')"
          case "$forms_status" in
            403|404) ;;
            *) echo "Unexpected forms API status after destruction: $forms_status" >&2; exit 1 ;;
          esac

      - name: Restore legacy deployer permissions after a failed or cancelled permission phase
        if: (failure() || cancelled()) && inputs.mode == 'apply' && steps.permissions.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false \
            -var='legacy_stack_enabled=false' \
            -var='legacy_deployer_permissions_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -target='google_project_iam_member.github_deployer_project_roles' \
            -out=restore-legacy-permissions.tfplan
          tofu -chdir="$TOFU_DIR" show -json restore-legacy-permissions.tfplan > restore-legacy-permissions-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py restore-legacy-permissions-plan.json --phase restore-legacy-permissions
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve restore-legacy-permissions.tfplan
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode \
            -var='legacy_stack_enabled=false' \
            -var='legacy_deployer_permissions_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -target='google_project_iam_member.github_deployer_project_roles' \
            -out=restore-legacy-permissions-verify.tfplan

      - name: Re-enable Cloud SQL deletion protection after a failed or cancelled decommission
        if: (failure() || cancelled()) && inputs.mode == 'apply' && steps.arm.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail
          sql_instances_json="$(gcloud sql instances list --project "$TF_VAR_gcp_project_id" --format=json)"
          legacy_sql_count="$(jq '[.[] | select(.name == "abpiv-n8n-postgres")] | length' <<<"$sql_instances_json")"
          case "$legacy_sql_count" in
            0)
              echo "Cloud SQL is already absent; state-only deletion protection cannot be restored." >&2
              exit 0
              ;;
            1) ;;
            *)
              echo "Found an unexpected number of matching Cloud SQL instances during recovery: ${legacy_sql_count}." >&2
              exit 1
              ;;
          esac
          tofu -chdir="$TOFU_DIR" plan -input=false \
            -var='legacy_stack_enabled=true' \
            -var='legacy_deployer_permissions_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -target='google_sql_database_instance.n8n[0]' \
            -out=protect.tfplan
          tofu -chdir="$TOFU_DIR" show -json protect.tfplan > protect-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py protect-plan.json --phase protect
          tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve protect.tfplan
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode \
            -var='legacy_stack_enabled=true' \
            -var='legacy_deployer_permissions_enabled=true' \
            -var='legacy_destruction_armed=false' \
            -target='google_sql_database_instance.n8n[0]' \
            -out=protect-verify.tfplan

      - name: Remove runtime artifacts from the runner
        if: always()
        run: rm -f "$TOFU_DIR/arm.tfplan" "$TOFU_DIR/protect.tfplan" "$TOFU_DIR/protect-verify.tfplan" "$TOFU_DIR/destroy-preview.tfplan" "$TOFU_DIR/destroy-resources.tfplan" "$TOFU_DIR/destroy-resources-verify.tfplan" "$TOFU_DIR/destroy-permissions.tfplan" "$TOFU_DIR/destroy-verify.tfplan" "$TOFU_DIR/restore-legacy-permissions.tfplan" "$TOFU_DIR/restore-legacy-permissions-verify.tfplan" arm-plan.json protect-plan.json destroy-preview-plan.json destroy-resources-plan.json destroy-permissions-plan.json restore-legacy-permissions-plan.json destroy-actions-only.txt destroy-resource-actions-expected.txt destroy-resource-actions-final.txt destroy-permission-actions-expected.txt destroy-permission-actions-final.txt destruction-actions.txt destruction-actions.sha256
