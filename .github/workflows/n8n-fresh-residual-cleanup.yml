name: Plan or apply fresh-start n8n residual cleanup

on:
  workflow_dispatch:
    inputs:
      cleanup_phase:
        description: Prune five obsolete roles now, or finalize the Google-retained private network after its producer resource is released.
        required: true
        type: choice
        options: [prune-obsolete-permissions, finalize-private-network]
      mode:
        description: Generate the exact manifest first; apply only in a later dispatch.
        required: true
        type: choice
        options: [plan, apply]
      confirm_acceptance:
        description: Confirm Allan's manual fresh-runtime acceptance remains satisfied.
        required: true
        type: string
      confirm_abandoned_data:
        description: Confirm the abandoned legacy data remains authorized for deletion without inspection or preservation.
        required: true
        type: string
      confirm_destroy:
        description: In apply mode, type destroy-abandoned-fresh-start-legacy-n8n.
        required: false
        type: string
      review_decision:
        description: In apply mode, enter COMPLIANT / APPROVED / READY from the same rigorous reviewer.
        required: false
        type: string
      reviewer_identity:
        description: Record the same independent reviewer's GitHub handle or durable identity.
        required: true
        type: string
      reviewed_commit_sha:
        description: In apply mode, enter the exact 40-character commit SHA from the reviewed plan dispatch.
        required: false
        type: string
      reviewed_allowlist_sha256:
        description: In apply mode, enter the SHA-256 printed by the reviewed plan dispatch.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: abpiv-shared-runtime-mutation
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  GCP_ZONE: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  VM_NAME: abpiv-runtime-vm
  PRIVATE_RANGE_NAME: abpiv-n8n-private-services
  PRIVATE_PEERING_NAME: servicenetworking-googleapis-com
  DEPLOYER_SERVICE_ACCOUNT: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
  REVIEWER_IDENTITY: ${{ inputs.reviewer_identity }}
  REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: "true"
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  TF_VAR_gcp_zone: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  TF_VAR_runtime_origin: compute
  TF_VAR_legacy_cloud_run_min_instances: "0"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  cleanup:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_acceptance == 'fresh-runtime-manual-acceptance-passed' &&
      inputs.confirm_abandoned_data == 'fresh-start-abandoned-data-authorized' &&
      inputs.reviewer_identity != '' &&
      (
        inputs.mode == 'plan' ||
        (
          inputs.mode == 'apply' &&
          inputs.confirm_destroy == 'destroy-abandoned-fresh-start-legacy-n8n' &&
          inputs.review_decision == 'COMPLIANT / APPROVED / READY' &&
          inputs.reviewed_commit_sha != '' &&
          inputs.reviewed_allowlist_sha256 != ''
        )
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && 'production-destruction' || 'production-plan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1

      - name: Bind apply to the exact reviewed commit
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT_SHA"

      - name: Select the exact residual state
        run: |
          set -euo pipefail
          {
            case "${{ inputs.cleanup_phase }}" in
              prune-obsolete-permissions)
                echo "RESIDUAL_ALLOWLIST_PHASE=prune-obsolete-legacy-permissions"
                echo "TF_VAR_legacy_private_service_connection_enabled=true"
                echo "TF_VAR_legacy_service_networking_permission_enabled=true"
                ;;
              finalize-private-network)
                echo "RESIDUAL_ALLOWLIST_PHASE=finalize-legacy-private-network-resources"
                echo "TF_VAR_legacy_private_service_connection_enabled=false"
                echo "TF_VAR_legacy_service_networking_permission_enabled=true"
                ;;
              *) exit 1 ;;
            esac
            echo "TF_VAR_legacy_stack_enabled=false"
            echo "TF_VAR_legacy_deployer_permissions_enabled=false"
            echo "TF_VAR_legacy_destruction_armed=false"
          } >> "$GITHUB_ENV"

      - name: Verify retained production and the exact residual boundary
        run: |
          set -euo pipefail
          machine_type="$(gcloud compute instances describe "$VM_NAME" --project "$TF_VAR_gcp_project_id" --zone "$GCP_ZONE" --format='value(machineType.basename())')"
          case "$machine_type" in
            e2-custom-medium-6144|e2-standard-2) ;;
            *) echo "Unexpected live VM machine type: $machine_type" >&2; exit 1 ;;
          esac
          echo "TF_VAR_compute_machine_type=$machine_type" >> "$GITHUB_ENV"

          gcloud compute ssh "$VM_NAME" --project "$TF_VAR_gcp_project_id" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "set -euo pipefail; test \"\$(sudo cat /etc/abpiv-n8n/mode)\" = active; test \"\$(sudo systemctl is-active abpiv-cloudflared.service)\" = active; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-postgres-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-n8n-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-nginx-1)\" = healthy; test \"\$(sudo curl --fail --silent --show-error --header 'Host: workflows.lobst3rs.com' http://127.0.0.1:8080/healthz)\" = active-ready"

          editor_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "https://${TF_VAR_editor_hostname}/")"
          test "$editor_status" = 302
          forms_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://forms.allanbpediniv.com/rest/settings')"
          case "$forms_status" in
            403|404) ;;
            *) echo "Unexpected forms API status: $forms_status" >&2; exit 1 ;;
          esac

          addresses_json="$(gcloud compute addresses list --project "$TF_VAR_gcp_project_id" --global --filter="name=${PRIVATE_RANGE_NAME}" --format=json)"
          address_count="$(jq --arg name "$PRIVATE_RANGE_NAME" '[.[] | select(.name == $name and .purpose == "VPC_PEERING")] | length' <<<"$addresses_json")"
          networks_json="$(gcloud compute networks peerings list --project "$TF_VAR_gcp_project_id" --network=abpiv-n8n-network --format=json)"
          connection_count="$(jq --arg name "$PRIVATE_PEERING_NAME" '[.[] | .peerings[]? | select(.name == $name)] | length' <<<"$networks_json")"
          case "${{ inputs.cleanup_phase }}" in
            prune-obsolete-permissions)
              test "$address_count" -eq 1
              test "$connection_count" -eq 1
              ;;
            finalize-private-network)
              test "$address_count" -ge 0 && test "$address_count" -le 1
              test "$connection_count" -ge 0 && test "$connection_count" -le 1
              ;;
          esac

          member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
          policy_json="$(gcloud projects get-iam-policy "$TF_VAR_gcp_project_id" --format=json)"
          service_role_count="$(jq --arg role 'roles/servicenetworking.networksAdmin' --arg member "$member" '[.bindings[]? | select(.role == $role) | .members[]? | select(. == $member)] | length' <<<"$policy_json")"
          if test "$address_count" -gt 0 || test "$connection_count" -gt 0; then
            test "$service_role_count" -eq 1
          else
            test "$service_role_count" -ge 0 && test "$service_role_count" -le 1
            if test "${{ inputs.cleanup_phase }}" = finalize-private-network && test "$service_role_count" -eq 0; then
              echo "TF_VAR_legacy_service_networking_permission_enabled=false" >> "$GITHUB_ENV"
            fi
          fi

      - name: Generate the exact reviewed residual manifest
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" init -input=false
          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -out=residual-preview.tfplan
          tofu -chdir="$TOFU_DIR" show -json residual-preview.tfplan > residual-preview-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py residual-preview-plan.json --phase "$RESIDUAL_ALLOWLIST_PHASE"
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' residual-preview-plan.json \
            | LC_ALL=C sort > residual-actions-expected.txt

          : > residual-permission-actions-expected.txt
          if test "${{ inputs.cleanup_phase }}" = finalize-private-network; then
            tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
              -var='legacy_service_networking_permission_enabled=false' \
              -target='google_project_iam_member.github_deployer_project_roles["roles/servicenetworking.networksAdmin"]' \
              -out=residual-permission-preview.tfplan
            tofu -chdir="$TOFU_DIR" show -json residual-permission-preview.tfplan > residual-permission-preview-plan.json
            python infra/n8n/tools/assert-plan-allowlist.py residual-permission-preview-plan.json --phase finalize-legacy-private-network-permission
            jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' residual-permission-preview-plan.json \
              | LC_ALL=C sort > residual-permission-actions-expected.txt
          fi

          {
            cat residual-actions-expected.txt
            cat residual-permission-actions-expected.txt
            echo "cleanup-phase ${{ inputs.cleanup_phase }}"
            echo "commit ${GITHUB_SHA}"
            echo "configuration legacy_stack_enabled=false"
            echo "configuration legacy_deployer_permissions_enabled=false"
            echo "configuration legacy_private_service_connection_enabled=${TF_VAR_legacy_private_service_connection_enabled}"
            echo "configuration legacy_service_networking_permission_enabled=${TF_VAR_legacy_service_networking_permission_enabled}"
            echo "fresh-start-abandoned-data ${{ inputs.confirm_abandoned_data }}"
            echo "reviewer ${REVIEWER_IDENTITY}"
          } | LC_ALL=C sort > residual-actions.txt
          sha256sum residual-actions.txt | tee residual-actions.sha256
          tee -a "$GITHUB_STEP_SUMMARY" < residual-actions.txt
          tee -a "$GITHUB_STEP_SUMMARY" < residual-actions.sha256

      - name: Match the same reviewer's approved manifest
        if: inputs.mode == 'apply'
        env:
          REVIEWED_ALLOWLIST_SHA256: ${{ inputs.reviewed_allowlist_sha256 }}
        run: |
          set -euo pipefail
          actual="$(cut -d' ' -f1 residual-actions.sha256)"
          test "$actual" = "$REVIEWED_ALLOWLIST_SHA256"

      - name: Regenerate and match the reviewed residual plan
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -out=residual-final.tfplan
          tofu -chdir="$TOFU_DIR" show -json residual-final.tfplan > residual-final-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py residual-final-plan.json --phase "$RESIDUAL_ALLOWLIST_PHASE"
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' residual-final-plan.json \
            | LC_ALL=C sort > residual-actions-final.txt
          cmp --silent residual-actions-expected.txt residual-actions-final.txt

      - name: Apply only the freshly regenerated and hash-matched residual-resource plan
        if: inputs.mode == 'apply'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve residual-final.tfplan

      - name: Verify the immediate permission-prune state
        if: inputs.mode == 'apply' && inputs.cleanup_phase == 'prune-obsolete-permissions'
        run: |
          set -euo pipefail
          member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
          policy_json="$(gcloud projects get-iam-policy "$TF_VAR_gcp_project_id" --format=json)"
          for role in roles/certificatemanager.editor roles/cloudsql.admin roles/compute.loadBalancerAdmin roles/run.admin roles/vpcaccess.admin; do
            test "$(jq --arg role "$role" --arg member "$member" '[.bindings[]? | select(.role == $role) | .members[]? | select(. == $member)] | length' <<<"$policy_json")" -eq 0
          done
          test "$(jq --arg role 'roles/servicenetworking.networksAdmin' --arg member "$member" '[.bindings[]? | select(.role == $role) | .members[]? | select(. == $member)] | length' <<<"$policy_json")" -eq 1
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode -out=residual-prune-verify.tfplan

      - name: Verify the residual private network is absent
        if: inputs.mode == 'apply' && inputs.cleanup_phase == 'finalize-private-network'
        run: |
          set -euo pipefail
          addresses_json="$(gcloud compute addresses list --project "$TF_VAR_gcp_project_id" --global --filter="name=${PRIVATE_RANGE_NAME}" --format=json)"
          test "$(jq --arg name "$PRIVATE_RANGE_NAME" '[.[] | select(.name == $name)] | length' <<<"$addresses_json")" -eq 0
          networks_json="$(gcloud compute networks peerings list --project "$TF_VAR_gcp_project_id" --network=abpiv-n8n-network --format=json)"
          test "$(jq --arg name "$PRIVATE_PEERING_NAME" '[.[] | .peerings[]? | select(.name == $name)] | length' <<<"$networks_json")" -eq 0
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode -out=residual-resources-verify.tfplan

      - name: Regenerate and match the final service-networking permission plan
        if: inputs.mode == 'apply' && inputs.cleanup_phase == 'finalize-private-network'
        run: |
          set -euo pipefail
          tofu -chdir="$TOFU_DIR" plan -input=false -lock=false \
            -var='legacy_service_networking_permission_enabled=false' \
            -out=residual-permission-final.tfplan
          tofu -chdir="$TOFU_DIR" show -json residual-permission-final.tfplan > residual-permission-final-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py residual-permission-final-plan.json --phase finalize-legacy-private-network-permission
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' residual-permission-final-plan.json \
            | LC_ALL=C sort > residual-permission-actions-final.txt
          cmp --silent residual-permission-actions-expected.txt residual-permission-actions-final.txt

      - name: Apply only the freshly regenerated final-permission plan
        if: inputs.mode == 'apply' && inputs.cleanup_phase == 'finalize-private-network'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve residual-permission-final.tfplan

      - name: Verify final permission absence and full convergence
        if: inputs.mode == 'apply' && inputs.cleanup_phase == 'finalize-private-network'
        run: |
          set -euo pipefail
          member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
          policy_json="$(gcloud projects get-iam-policy "$TF_VAR_gcp_project_id" --format=json)"
          test "$(jq --arg role 'roles/servicenetworking.networksAdmin' --arg member "$member" '[.bindings[]? | select(.role == $role) | .members[]? | select(. == $member)] | length' <<<"$policy_json")" -eq 0
          tofu -chdir="$TOFU_DIR" plan -input=false -detailed-exitcode \
            -var='legacy_service_networking_permission_enabled=false' \
            -out=residual-full-verify.tfplan

      - name: Verify retained production after the residual mutation
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" --project "$TF_VAR_gcp_project_id" --zone "$GCP_ZONE" --tunnel-through-iap --quiet --command \
            "set -euo pipefail; test \"\$(sudo cat /etc/abpiv-n8n/mode)\" = active; test \"\$(sudo systemctl is-active abpiv-cloudflared.service)\" = active; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-postgres-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-n8n-1)\" = healthy; test \"\$(sudo docker inspect --format '{{.State.Health.Status}}' abpiv-n8n-nginx-1)\" = healthy; test \"\$(sudo curl --fail --silent --show-error --header 'Host: workflows.lobst3rs.com' http://127.0.0.1:8080/healthz)\" = active-ready"
          editor_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "https://${TF_VAR_editor_hostname}/")"
          test "$editor_status" = 302
          forms_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://forms.allanbpediniv.com/rest/settings')"
          case "$forms_status" in
            403|404) ;;
            *) echo "Unexpected forms API status after residual cleanup: $forms_status" >&2; exit 1 ;;
          esac

      - name: Remove runtime artifacts from the runner
        if: always()
        run: rm -f "$TOFU_DIR/residual-preview.tfplan" "$TOFU_DIR/residual-permission-preview.tfplan" "$TOFU_DIR/residual-final.tfplan" "$TOFU_DIR/residual-prune-verify.tfplan" "$TOFU_DIR/residual-resources-verify.tfplan" "$TOFU_DIR/residual-permission-final.tfplan" "$TOFU_DIR/residual-full-verify.tfplan" residual-preview-plan.json residual-permission-preview-plan.json residual-final-plan.json residual-permission-final-plan.json residual-actions-expected.txt residual-actions-final.txt residual-permission-actions-expected.txt residual-permission-actions-final.txt residual-actions.txt residual-actions.sha256
