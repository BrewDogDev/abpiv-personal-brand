name: Plan or apply shared-runtime IAM bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate review evidence first; apply only in a later dispatch.
        required: true
        type: choice
        options: [plan, apply]
      confirm_plan:
        description: In plan mode, type plan-preparation-iam-bootstrap.
        required: false
        type: string
      confirm_apply:
        description: In apply mode, type apply-preparation-iam-bootstrap.
        required: false
        type: string
      review_decision:
        description: In apply mode, enter COMPLIANT / APPROVED / READY from the independent reviewer.
        required: false
        type: string
      reviewer_identity:
        description: In apply mode, record the independent reviewer's GitHub handle or durable identity.
        required: false
        type: string
      reviewed_commit_sha:
        description: In apply mode, enter the exact 40-character commit SHA from the reviewed plan dispatch.
        required: false
        type: string
      reviewed_actions_sha256:
        description: In apply mode, enter the action-manifest SHA-256 from the reviewed plan dispatch.
        required: false
        type: string
      reviewed_moves_sha256:
        description: In apply mode, enter the state-move manifest SHA-256 from the reviewed plan dispatch.
        required: false
        type: string
      reviewed_plan_values_sha256:
        description: In apply mode, enter the non-sensitive plan-values SHA-256 from the reviewed plan dispatch.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: abpiv-shared-runtime-mutation
  cancel-in-progress: false

env:
  TOFU_DIR: infra/n8n/opentofu
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_auth_domain: ${{ vars.N8N_CLOUDFLARE_ACCESS_AUTH_DOMAIN || 'lobst3rs.cloudflareaccess.com' }}
  TF_VAR_cloudflare_access_organization_name: ${{ vars.N8N_CLOUDFLARE_ACCESS_ORGANIZATION_NAME || 'ABPIV Internal' }}
  TF_VAR_allanbpediniv_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
  TF_VAR_enable_cloudflare_edge: "true"
  TF_VAR_gcp_project_id: ${{ vars.N8N_GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.N8N_GCP_REGION || 'us-east1' }}
  TF_VAR_gcp_zone: ${{ vars.N8N_GCP_ZONE || 'us-east1-c' }}
  TF_VAR_editor_hostname: ${{ vars.N8N_EDITOR_HOSTNAME }}
  TF_VAR_editor_zone_id: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
  TF_VAR_editor_zone_name: ${{ vars.N8N_EDITOR_ZONE_NAME || 'lobst3rs.com' }}
  TF_VAR_editor_access_allowed_emails: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_EMAILS || '["allanblankpedin@gmail.com"]' }}
  TF_VAR_editor_access_allowed_group_ids: ${{ vars.N8N_EDITOR_ACCESS_ALLOWED_GROUP_IDS || '[]' }}
  TF_VAR_manage_cloudflare_access_organization: ${{ vars.N8N_MANAGE_CLOUDFLARE_ACCESS_ORGANIZATION || 'false' }}
  TF_VAR_github_oidc_principal_set: ${{ vars.N8N_GITHUB_OIDC_PRINCIPAL_SET }}
  TF_VAR_runtime_origin: cloud_run
  TF_VAR_legacy_stack_enabled: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  bootstrap:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (inputs.mode == 'plan' && inputs.confirm_plan == 'plan-preparation-iam-bootstrap') ||
        (
          inputs.mode == 'apply' &&
          inputs.confirm_apply == 'apply-preparation-iam-bootstrap' &&
          inputs.review_decision == 'COMPLIANT / APPROVED / READY' &&
          inputs.reviewer_identity != '' &&
          inputs.reviewed_commit_sha != '' &&
          inputs.reviewed_actions_sha256 != '' &&
          inputs.reviewed_moves_sha256 != '' &&
          inputs.reviewed_plan_values_sha256 != ''
        )
      )
    name: ${{ inputs.mode == 'apply' && 'Apply reviewed IAM bootstrap' || 'Plan IAM bootstrap' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && 'production' || 'production-plan' }}
    steps:
      - uses: actions/checkout@v4

      - name: Bind apply to the exact reviewed commit
        if: inputs.mode == 'apply'
        env:
          REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT_SHA"

      - name: Check required configuration
        env:
          GCP_PROJECT: ${{ vars.N8N_GCP_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CLOUDFLARE_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FORMS_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID_ALLANBPEDINIV }}
          EDITOR_ZONE: ${{ vars.N8N_EDITOR_ZONE_ID || vars.CLOUDFLARE_ZONE_ID_LOBST3RS }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT GCP_SERVICE_ACCOUNT WORKLOAD_IDENTITY_PROVIDER CLOUDFLARE_ACCOUNT FORMS_ZONE EDITOR_ZONE CLOUDFLARE_API_TOKEN; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.N8N_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.N8N_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1

      - name: Verify current bootstrap permissions before planning or applying
        env:
          GCP_PROJECT_ID: ${{ vars.N8N_GCP_PROJECT_ID }}
          PLAUSIBLE_RUNTIME_SERVICE_ACCOUNT: plausible-analytics-vm@${{ vars.N8N_GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          missing=0

          required_project_permissions=(
            iam.serviceAccounts.create
            resourcemanager.projects.getIamPolicy
            resourcemanager.projects.setIamPolicy
          )
          project_request="$({ printf '%s\n' "${required_project_permissions[@]}"; } | jq --raw-input --slurp 'split("\n") | map(select(length > 0)) | {permissions: .}')"
          project_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            --header 'Content-Type: application/json' \
            --data "$project_request" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          for permission in "${required_project_permissions[@]}"; do
            jq --exit-status --arg permission "$permission" '.permissions | index($permission) != null' \
              <<<"$project_response" >/dev/null || {
                echo "::error::The deployer does not already hold bootstrap permission $permission on project $GCP_PROJECT_ID."
                missing=1
              }
          done

          required_service_account_permissions=(
            iam.serviceAccounts.getIamPolicy
            iam.serviceAccounts.setIamPolicy
          )
          service_account_request="$({ printf '%s\n' "${required_service_account_permissions[@]}"; } | jq --raw-input --slurp 'split("\n") | map(select(length > 0)) | {permissions: .}')"
          service_account_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            --header 'Content-Type: application/json' \
            --data "$service_account_request" \
            "https://iam.googleapis.com/v1/projects/${GCP_PROJECT_ID}/serviceAccounts/${PLAUSIBLE_RUNTIME_SERVICE_ACCOUNT}:testIamPermissions")"
          unset access_token
          for permission in "${required_service_account_permissions[@]}"; do
            jq --exit-status --arg permission "$permission" '.permissions | index($permission) != null' \
              <<<"$service_account_response" >/dev/null || {
                echo "::error::The deployer does not already hold bootstrap permission $permission on the existing Plausible runtime service account."
                missing=1
              }
          done
          test "$missing" -eq 0
          {
            printf 'project=%s\n' "$GCP_PROJECT_ID"
            printf 'project_permission=%s\n' "${required_project_permissions[@]}"
            printf 'service_account=%s\n' "$PLAUSIBLE_RUNTIME_SERVICE_ACCOUNT"
            printf 'service_account_permission=%s\n' "${required_service_account_permissions[@]}"
          } > bootstrap-permission-preflight.txt
          printf 'Current IAM bootstrap permission preflight passed.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the targeted bootstrap plan and exact action manifest
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          targets=(
            '-target=google_project_iam_member.github_deployer_project_roles'
            '-target=google_service_account.n8n_compute'
            '-target=google_service_account_iam_member.github_deployer_compute_service_account_user'
            '-target=google_service_account_iam_member.github_deployer_plausible_runtime_service_account_user'
            '-target=google_compute_global_address.private_services'
            '-target=google_service_networking_connection.private_services'
            '-target=google_vpc_access_connector.n8n'
            '-target=google_sql_database_instance.n8n'
            '-target=google_sql_database.n8n'
            '-target=google_storage_bucket.binary_data'
            '-target=google_cloud_run_v2_service.n8n'
            '-target=google_compute_region_network_endpoint_group.n8n'
            '-target=google_compute_backend_service.n8n'
            '-target=google_compute_url_map.n8n'
            '-target=google_certificate_manager_certificate.n8n'
            '-target=google_certificate_manager_certificate_map.n8n'
            '-target=google_compute_target_https_proxy.n8n'
            '-target=google_compute_global_address.n8n_lb'
            '-target=google_compute_global_forwarding_rule.https'
            '-target=google_service_account.n8n_runtime'
            '-target=google_project_iam_member.runtime_cloudsql_client'
            '-target=google_storage_bucket_iam_member.runtime_binary_data_object_user'
            '-target=google_service_account_iam_member.github_deployer_runtime_service_account_user'
          )
          tofu -chdir="$TOFU_DIR" init -input=false
          tofu -chdir="$TOFU_DIR" plan -input=false -out=bootstrap.tfplan "${targets[@]}"
          tofu -chdir="$TOFU_DIR" show -json bootstrap.tfplan > bootstrap-plan.json
          python infra/n8n/tools/assert-plan-allowlist.py bootstrap-plan.json --phase bootstrap
          jq --raw-output '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join(",")) \(.address)"' bootstrap-plan.json \
            | LC_ALL=C sort > bootstrap-actions.txt
          test -s bootstrap-actions.txt
          sha256sum bootstrap-actions.txt | tee bootstrap-actions.sha256
          jq --raw-output '.resource_changes[] | select(.previous_address != null) | "\(.previous_address) -> \(.address)"' bootstrap-plan.json \
            | LC_ALL=C sort > bootstrap-moves.txt
          test -s bootstrap-moves.txt
          sha256sum bootstrap-moves.txt | tee bootstrap-moves.sha256
          values_sha="$(python infra/n8n/tools/canonical-plan-values.py bootstrap-plan.json bootstrap-plan-values.json)"
          printf '%s  bootstrap-plan-values.json\n' "$values_sha" | tee bootstrap-plan-values.sha256
          tofu -chdir="$TOFU_DIR" show -no-color bootstrap.tfplan > bootstrap-plan.txt
          manifest_sha="$(cut -d' ' -f1 bootstrap-actions.sha256)"
          moves_sha="$(cut -d' ' -f1 bootstrap-moves.sha256)"
          {
            printf '### Targeted shared-runtime IAM bootstrap plan\n\n'
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Action-manifest SHA-256: %s\n' "$manifest_sha"
            printf -- '- State-move manifest SHA-256: %s\n' "$moves_sha"
            printf -- '- Non-sensitive plan-values SHA-256: %s\n' "$values_sha"
            printf -- '- Mode: %s\n\n' "$DISPATCH_MODE"
            printf '```text\n'
            cat bootstrap-actions.txt
            printf '```\n'
            printf '\nState-address moves:\n\n```text\n'
            cat bootstrap-moves.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted review evidence
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: shared-runtime-iam-bootstrap-plan-${{ github.sha }}
          path: |
            bootstrap-plan.txt
            bootstrap-actions.txt
            bootstrap-actions.sha256
            bootstrap-moves.txt
            bootstrap-moves.sha256
            bootstrap-plan-values.json
            bootstrap-plan-values.sha256
            bootstrap-permission-preflight.txt
          if-no-files-found: error
          retention-days: 7

      - name: Match the independently reviewed action and value manifests
        if: inputs.mode == 'apply'
        env:
          REVIEWED_ACTIONS_SHA256: ${{ inputs.reviewed_actions_sha256 }}
          REVIEWED_MOVES_SHA256: ${{ inputs.reviewed_moves_sha256 }}
          REVIEWED_PLAN_VALUES_SHA256: ${{ inputs.reviewed_plan_values_sha256 }}
          REVIEWER_IDENTITY: ${{ inputs.reviewer_identity }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_ACTIONS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REVIEWED_MOVES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REVIEWED_PLAN_VALUES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual_actions_sha="$(cut -d' ' -f1 bootstrap-actions.sha256)"
          actual_moves_sha="$(cut -d' ' -f1 bootstrap-moves.sha256)"
          actual_values_sha="$(cut -d' ' -f1 bootstrap-plan-values.sha256)"
          test "$actual_actions_sha" = "$REVIEWED_ACTIONS_SHA256"
          test "$actual_moves_sha" = "$REVIEWED_MOVES_SHA256"
          test "$actual_values_sha" = "$REVIEWED_PLAN_VALUES_SHA256"
          printf 'Reviewed action, state-move, and non-sensitive value manifests matched for reviewer %s.\n' "$REVIEWER_IDENTITY" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply only the freshly regenerated reviewed bootstrap plan
        if: inputs.mode == 'apply'
        run: tofu -chdir="$TOFU_DIR" apply -input=false -auto-approve bootstrap.tfplan

      - name: Remove plan material from the runner
        if: always()
        run: rm -f bootstrap.tfplan bootstrap-plan.json bootstrap-plan.txt bootstrap-actions.txt bootstrap-actions.sha256 bootstrap-moves.txt bootstrap-moves.sha256 bootstrap-plan-values.json bootstrap-plan-values.sha256 bootstrap-permission-preflight.txt
