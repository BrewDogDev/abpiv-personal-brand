<!doctype html>
<!-- @dsCard group="Brand" name="Headshot Treatment" subtitle="Cool duotone wash + framing" viewport="700x170" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  body{padding:22px 26px}
  .row{display:flex;gap:24px;align-items:center}
  .pf{position:relative;width:120px;height:120px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line-strong);flex:none}
  .pf img{width:100%;height:100%;object-fit:cover;object-position:center top}
  .pf::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(7,11,20,.45),transparent 58%)}
  .desc{max-width:360px}
  .desc p{font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--fg-2)}
  .desc b{color:var(--fg-0);font-weight:600}
</style></head>
<body>
  <div class="row">
    <div class="pf"><img src="../assets/headshot.png" alt="headshot"></div>
    <div class="desc"><p>Use the <b>original headshot</b> as-is — full color, no duotone or desaturation. Frame it with a hairline border and radius <b>--r-md</b>, with a subtle navy bottom scrim only where text must overlay. Keep it natural and human.</p></div>
  </div>
</body></html>
