<!doctype html>
<!-- @dsCard group="Brand" name="Coordination Mark" subtitle="Brand glyph + favicon" viewport="700x170" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  body{padding:24px 28px}
  .row{display:flex;align-items:center;gap:34px;flex-wrap:wrap}
  .badge{display:flex;flex-direction:column;align-items:center;gap:10px}
  .tile{display:flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);background:var(--bg-1)}
  .lm{font-family:var(--font-sans);font-weight:800;letter-spacing:-.03em;color:var(--fg-0);line-height:1}
  .lm .iv{color:inherit}
  .desc{max-width:300px}
  .desc p{font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--fg-2)}
  .desc b{color:var(--fg-0);font-weight:600}
</style></head>
<body>
  <div class="row">
    <div class="badge"><div class="tile" style="width:104px;height:104px;border-radius:var(--r-md)"><span class="lm" style="font-size:30px">ABPIV</span></div><span class="cap">app / avatar · 104</span></div>
    <div class="badge"><div class="tile" style="width:48px;height:48px;border-radius:var(--r-sm)"><span class="lm" style="font-size:15px">ABPIV</span></div><span class="cap">favicon · 32</span></div>
    <div class="desc"><p>The <b>ABPIV lettermark</b> — Schibsted Grotesk 800, tight <b>-0.03em</b> tracking, set in a <b>single color</b> (light on dark). Used as avatar, app icon, and favicon.</p></div>
  </div>
</body></html>
