<!doctype html>
<!-- @dsCard group="Brand" name="System Map Motif" subtitle="Animated route lines resolving to amber node" viewport="700x170" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  body{padding:0;background:var(--bg-0);overflow:hidden}
  .wrap{position:relative;height:170px}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .cap2{position:absolute;left:24px;bottom:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);z-index:2}
  .grid{stroke:rgba(120,160,200,.08);stroke-width:1}
  .route{stroke:#5FE6F4;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
  .branch{stroke:rgba(95,230,244,.34);stroke-width:1.5;fill:none}
  .way{fill:var(--bg-0);stroke:var(--cyan);stroke-width:1.5}
  .dest{fill:var(--amber)}
  .ring{fill:none;stroke:var(--amber);stroke-width:1.5;opacity:.6}
</style></head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 700 170" preserveAspectRatio="none">
      <!-- faint alignment grid -->
      <g class="grid">
        <line x1="0" y1="42" x2="700" y2="42"/><line x1="0" y1="85" x2="700" y2="85"/><line x1="0" y1="128" x2="700" y2="128"/>
        <line x1="140" y1="0" x2="140" y2="170"/><line x1="300" y1="0" x2="300" y2="170"/><line x1="470" y1="0" x2="470" y2="170"/>
      </g>

      <!-- branch stubs feeding the main route -->
      <path class="branch" d="M24 128 H140 V100"/>
      <path class="branch" d="M300 42 H410"/>

      <!-- main orthogonal route resolving to the amber destination -->
      <path id="trace" class="route" d="M24 42 H140 V128 H300 V42 H470 V96 H648"/>

      <!-- waypoints at decision corners -->
      <circle class="way" cx="140" cy="42" r="4"/>
      <circle class="way" cx="140" cy="128" r="4"/>
      <circle class="way" cx="300" cy="128" r="4"/>
      <circle class="way" cx="300" cy="42" r="4"/>
      <circle class="way" cx="470" cy="42" r="4"/>
      <circle class="way" cx="470" cy="96" r="4"/>

      <!-- amber destination + ping -->
      <circle class="ring" cx="648" cy="96" r="7">
        <animate attributeName="r" values="6;13;6" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0;.6" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle class="dest" cx="648" cy="96" r="5.5"/>

      <!-- live signal pulse traveling the route -->
      <circle r="3.5" fill="#5FE6F4">
        <animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" rotate="0">
          <mpath href="#trace"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <span class="cap2">Signal trace · routed path resolving to destination</span>
  </div>
</body></html>
