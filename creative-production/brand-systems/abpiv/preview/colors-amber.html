<!doctype html>
<!-- @dsCard group="Colors" name="Amber — Human Agency" subtitle="Trust & emphasis — used sparingly" viewport="700x190" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  .stack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { border-radius: var(--r-md); border: 1px solid var(--line); height: 104px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .name { font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
  .role { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: auto; }
  .note { margin-top: 12px; font-size: 12px; color: var(--fg-2); font-family: var(--font-sans); }
  .note b { color: var(--amber); font-weight: 600; }
</style></head>
<body>
  <div class="stack">
    <div class="cell" style="background:var(--amber-bright)"><span class="role" style="color:#3A2706">bright</span><span class="name" style="color:#3A2706">amber-bright</span><span class="val" style="color:#3A2706">#FFC062</span></div>
    <div class="cell" style="background:var(--amber)"><span class="role" style="color:#3A2706">emphasis accent</span><span class="name" style="color:#3A2706">amber</span><span class="val" style="color:#3A2706">#F4A63C</span></div>
    <div class="cell" style="background:var(--amber-deep)"><span class="role" style="color:#1A1305">deep</span><span class="name" style="color:#fff">amber-deep</span><span class="val" style="color:#1A1305">#C57E1E</span></div>
  </div>
  <p class="note">Human agency &amp; trust. <b>Use sparingly</b> — one amber moment per frame, max.</p>
</body></html>
