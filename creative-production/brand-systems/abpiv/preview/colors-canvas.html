<!doctype html>
<!-- @dsCard group="Colors" name="Canvas / Backgrounds" subtitle="Deep navy-black canvas, 5 elevations" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  .stack { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .cell { border-radius: var(--r-md); border: 1px solid var(--line); height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .name { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--fg-0); }
</style></head>
<body>
  <div class="stack">
    <div class="cell" style="background:var(--bg-void)"><span class="name">void</span><span class="val">#04070D</span></div>
    <div class="cell" style="background:var(--bg-0)"><span class="name">bg-0</span><span class="val">#070B14</span></div>
    <div class="cell" style="background:var(--bg-1)"><span class="name">bg-1</span><span class="val">#0B1220</span></div>
    <div class="cell" style="background:var(--bg-2)"><span class="name">bg-2</span><span class="val">#101A2C</span></div>
    <div class="cell" style="background:var(--bg-3)"><span class="name">bg-3</span><span class="val">#16243A</span></div>
  </div>
</body></html>
