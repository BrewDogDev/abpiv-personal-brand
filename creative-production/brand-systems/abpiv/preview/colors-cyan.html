<!doctype html>
<!-- @dsCard group="Colors" name="Cyan — Systems Accent" subtitle="Intelligence, coordination, active movement" viewport="700x160" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  .stack { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cell { border-radius: var(--r-md); border: 1px solid var(--line); height: 104px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .name { font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
  .role { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: auto; }
</style></head>
<body>
  <div class="stack">
    <div class="cell" style="background:var(--cyan-bright)"><span class="role" style="color:var(--cyan-ink)">bright</span><span class="name" style="color:var(--cyan-ink)">cyan-bright</span><span class="val" style="color:var(--cyan-ink)">#5FE6F4</span></div>
    <div class="cell" style="background:var(--cyan)"><span class="role" style="color:var(--cyan-ink)">primary accent</span><span class="name" style="color:var(--cyan-ink)">cyan</span><span class="val" style="color:var(--cyan-ink)">#2CC8DC</span></div>
    <div class="cell" style="background:var(--cyan-deep)"><span class="role" style="color:#06222A">deep</span><span class="name" style="color:#06222A">cyan-deep</span><span class="val" style="color:#06222A">#1A8C9C</span></div>
    <div class="cell" style="background:var(--cyan-ink)"><span class="role" style="color:var(--cyan)">tinted fill</span><span class="name" style="color:var(--cyan-bright)">cyan-ink</span><span class="val" style="color:var(--cyan)">#06222A</span></div>
  </div>
</body></html>
