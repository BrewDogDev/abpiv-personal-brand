<!doctype html>
<!-- @dsCard group="Components" name="Inputs & Fields" subtitle="Subscribe field + focus ring" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  body{padding:24px 26px}
  .lbl{display:block;margin-bottom:14px}
  .field{display:flex;gap:10px;max-width:440px;margin-bottom:16px}
  input{flex:1;font-family:var(--font-sans);font-size:15px;color:var(--fg-0);background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;outline:none;transition:border-color var(--dur-fast)}
  input::placeholder{color:var(--fg-3)}
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow)}
  .sub{font-family:var(--font-sans);font-weight:600;font-size:15px;background:var(--cyan);color:var(--cyan-ink);border:none;border-radius:var(--r-sm);padding:0 18px;cursor:pointer}
  .focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow)}
</style></head>
<body>
  <span class="lbl">Inputs &amp; fields</span>
  <div class="field">
    <input placeholder="you@email.com">
    <button class="sub">Subscribe</button>
  </div>
  <div class="field">
    <input class="focus" value="focused state" readonly>
  </div>
  <span class="cap">Focus: cyan border + 3px cyan glow ring</span>
</body></html>
