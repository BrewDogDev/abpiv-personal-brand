<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base — s-1 to s-10" viewport="700x230" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  .scale{display:flex;flex-direction:column;gap:9px}
  .r{display:flex;align-items:center;gap:14px}
  .bar{height:14px;background:var(--cyan);border-radius:3px;opacity:.85}
  .t{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);width:90px}
</style></head>
<body>
  <div class="scale">
    <div class="r"><span class="t">s-1 · 4</span><div class="bar" style="width:4px"></div></div>
    <div class="r"><span class="t">s-2 · 8</span><div class="bar" style="width:8px"></div></div>
    <div class="r"><span class="t">s-3 · 12</span><div class="bar" style="width:12px"></div></div>
    <div class="r"><span class="t">s-4 · 16</span><div class="bar" style="width:16px"></div></div>
    <div class="r"><span class="t">s-5 · 24</span><div class="bar" style="width:24px"></div></div>
    <div class="r"><span class="t">s-6 · 32</span><div class="bar" style="width:32px"></div></div>
    <div class="r"><span class="t">s-7 · 48</span><div class="bar" style="width:48px"></div></div>
    <div class="r"><span class="t">s-8 · 64</span><div class="bar" style="width:64px"></div></div>
    <div class="r"><span class="t">s-9 · 96</span><div class="bar" style="width:96px"></div></div>
    <div class="r"><span class="t">s-10 · 128</span><div class="bar" style="width:128px"></div></div>
  </div>
</body></html>
