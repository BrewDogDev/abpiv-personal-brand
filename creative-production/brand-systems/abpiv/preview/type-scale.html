<!doctype html>
<!-- @dsCard group="Type" name="Type Scale" subtitle="Token → size / weight reference" viewport="700x290" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  body{padding:22px 26px}
  table{border-collapse:collapse;width:100%}
  td{padding:8px 10px;border-bottom:1px solid var(--line-faint);vertical-align:baseline}
  .tok{font-family:var(--font-mono);font-size:12px;color:var(--cyan)}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);text-align:right;white-space:nowrap}
  .ex{font-family:var(--font-sans);color:var(--fg-0)}
</style></head>
<body>
  <table>
    <tr><td class="tok">--t-display</td><td class="ex" style="font-weight:800;font-size:30px;letter-spacing:-.03em">Display</td><td class="px">48–104px / 800</td></tr>
    <tr><td class="tok">--t-h1</td><td class="ex" style="font-weight:700;font-size:24px;letter-spacing:-.025em">Heading 1</td><td class="px">36–64px / 700</td></tr>
    <tr><td class="tok">--t-h2</td><td class="ex" style="font-weight:700;font-size:20px">Heading 2</td><td class="px">28–40px / 700</td></tr>
    <tr><td class="tok">--t-h3</td><td class="ex" style="font-weight:600;font-size:17px">Heading 3</td><td class="px">22px / 600</td></tr>
    <tr><td class="tok">--t-body</td><td class="ex" style="font-size:15px;color:var(--fg-1)">Body copy</td><td class="px">17px / 400</td></tr>
    <tr><td class="tok">--t-chip</td><td class="ex" style="font-family:var(--font-mono);font-size:12px;text-transform:uppercase;color:var(--cyan)">Chip · mono</td><td class="px">13px / 500</td></tr>
  </table>
</body></html>
