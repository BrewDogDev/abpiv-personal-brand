upstream plausible_backend {
    server plausible:8000;
    keepalive 16;
}

server {
    listen 8000 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "active-ready\n";
    }

    location = /healthz/readiness {
        access_log off;
        proxy_pass http://plausible_backend/api/health;
        proxy_set_header Host analytics.lobst3rs.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://plausible_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 16m;
    }
}
