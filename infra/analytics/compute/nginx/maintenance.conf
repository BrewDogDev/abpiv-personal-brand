server {
    listen 8000 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "maintenance-ready\n";
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        return 503 "Scheduled analytics maintenance in progress. Please retry shortly.\n";
    }
}
