name: abpiv-n8n

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER: n8n
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
    volumes:
      - type: bind
        source: /run/n8n/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
      - type: bind
        source: /srv/n8n/postgres
        target: /var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=n8n --dbname=n8n"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: 0.35
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  n8n:
    image: docker.io/n8nio/n8n@sha256:a119e2e660cf728c8641cdd199c8129cee7e762241627c05be21563d5bbb3fea
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["tini", "--", "/opt/abpiv-n8n/scripts/n8n-entrypoint.sh"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PASSWORD_FILE: /run/n8n-runtime/postgres-password
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_SSL_ENABLED: "false"
      DB_POSTGRESDB_CONNECTION_TIMEOUT: "20000"
      DB_POSTGRESDB_IDLE_CONNECTION_TIMEOUT: "30000"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      GENERIC_TIMEZONE: America/New_York
      N8N_AVAILABLE_BINARY_DATA_MODES: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /var/lib/n8n/binary
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_EDITOR_BASE_URL: https://workflows.lobst3rs.com/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_HOST: forms.allanbpediniv.com
      N8N_ENCRYPTION_KEY_FILE: /run/n8n-runtime/encryption-key
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "2"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_SECURE_COOKIE: "true"
      WEBHOOK_URL: https://forms.allanbpediniv.com/
    volumes:
      - type: bind
        source: /run/n8n/encryption-key
        target: /run/host-secrets/encryption-key
        read_only: true
      - type: bind
        source: /run/n8n/postgres-password
        target: /run/host-secrets/postgres-password
        read_only: true
      - type: bind
        source: /opt/abpiv-n8n/scripts
        target: /opt/abpiv-n8n/scripts
        read_only: true
      - type: bind
        source: /srv/n8n/state
        target: /home/node/.n8n
      - type: bind
        source: /srv/n8n/binary
        target: /var/lib/n8n/binary
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    mem_limit: 1400m
    cpus: 0.45
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    tmpfs:
      - /run/n8n-runtime:rw,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000

  nginx:
    image: docker.io/library/nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: /opt/abpiv-n8n/nginx/current.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 128m
    cpus: 0.10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  backend:
    internal: true
  egress:
    driver: bridge
