# Provisioning replaces this file atomically. The repository default is maintenance mode.
server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "maintenance-ready\n";
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        return 503 "Scheduled maintenance in progress. Please retry shortly.\n";
    }
}
