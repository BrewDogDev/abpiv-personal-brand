map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream n8n_backend {
    server n8n:5678;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    return 404;
}

server {
    listen 8080;
    server_name forms.allanbpediniv.com;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "precommit-ready\n";
    }

    location ~ ^/(form|form-waiting)(/|$) {
        limit_except GET {
            deny all;
        }
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 16m;
    }

    location ~ ^/(webhook|webhook-waiting)(/|$) {
        add_header Retry-After "300" always;
        return 503;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name workflows.lobst3rs.com;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "precommit-ready\n";
    }

    location = /healthz/readiness {
        access_log off;
        proxy_pass http://n8n_backend/healthz/readiness;
        proxy_set_header Host workflows.lobst3rs.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        add_header Retry-After "300" always;
        return 503;
    }
}
